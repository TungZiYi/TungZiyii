/* Beta39: stable card geometry; viewport changes never fit the whole tree. */
:root { --node-w: min(148px, calc((100vw - 32px) / 3)); --node-h: 50px; --node-gap: 12px; }
.node-row .content-box { width:var(--node-w); min-width:var(--node-w); max-width:var(--node-w); height:var(--node-h); min-height:var(--node-h); max-height:var(--node-h); font-size:13px; border-radius:14px; flex-shrink:0; }
.node-group { gap:var(--node-gap); }
.node-group.four-node-grid { display:grid; grid-template-columns:repeat(2, max-content); gap:var(--node-gap); align-items:end; justify-items:center; }
#reason-pop { box-sizing:border-box; width:var(--node-w) !important; min-width:var(--node-w); max-width:var(--node-w); height:var(--node-h); min-height:var(--node-h); max-height:none; padding:8px 24px 8px 8px !important; border-radius:14px; align-items:center; }
#reason-pop textarea { flex:1; height:32px; min-height:0; max-height:none; font-size:13px; line-height:16px; }
#reason-ok { top:50% !important; transform:translateY(-50%); }


/* Unified input/note typography: fixed font, natural wrapping, centered text. */
#reason-pop { height:auto; min-height:var(--node-h) !important; max-height:none; padding:8px !important; align-items:center; justify-content:center; }
#reason-pop textarea { box-sizing:border-box; flex:none; width:100%; height:auto; min-height:18px; max-height:none !important; overflow:hidden; text-align:center; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; font-family:inherit; font-weight:500; font-size:13px; line-height:18px; letter-spacing:normal; }
.node-row .reason-tag, .node-row .reason-tag.above { bottom:calc(100% - 1px) !important; top:auto !important; left:-1px; right:-1px; min-height:40px; border:0; padding:8px !important; display:none; align-items:center; justify-content:center; box-sizing:border-box; white-space:normal; }
.node-row .reason-tag .note-text { width:100%; font-family:inherit; font-size:13px; font-weight:500; line-height:18px; letter-spacing:normal; text-align:center; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; }
.node-row .reason-tag[style*="display: block"] { display:flex !important; }


/* Beta 8.10: sticky notes have a 40px minimum height; text can expand naturally.
   Content can grow naturally; note text remains centered in both axes. */
.node-row .reason-tag,
.node-row .reason-tag.above {
    min-height: 40px !important;
    height: auto !important;
    align-items: center !important;
    justify-content: center !important;
}
.node-row .reason-tag .note-text {
    margin: auto 0;
}

/* Centered foreground editor; stays inside the visible area above the keyboard. */
#reason-backdrop { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.35); opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; }
body.iphone-pop-open #reason-backdrop { opacity:1; visibility:visible; }
#reason-pop { z-index:10001 !important; width:min(560px, calc(100vw - 16px)) !important; min-width:0; max-width:calc(100vw - 16px); min-height:0 !important; padding:24px !important; border-radius:42px; transform:none !important; box-shadow:0 16px 60px rgba(0,0,0,.15); }
html.light-mode #reason-pop { background:#ffffff !important; }
#reason-pop textarea { max-height:100% !important; overflow-y:auto; }


/* Compact keyboard-docked input: stable size and immediate position updates. */
#reason-backdrop { display:none !important; }
#reason-pop { width:var(--node-w) !important; min-width:var(--node-w); max-width:var(--node-w); min-height:var(--node-h) !important; padding:8px !important; border-radius:14px; box-shadow:none; transform:none !important; transition:opacity .12s, visibility .12s; }
#reason-pop textarea { font-size:13px; line-height:18px; text-align:center; }


/* 输入期间仅保留理由浮窗，布局仍保留以便确认后原位恢复。 */
body.iphone-input-focused #sheet,
body.iphone-input-focused .toggle-84,
body.iphone-input-focused .realm-card,
body.iphone-input-focused .toast-msg { opacity:0 !important; pointer-events:none !important; transition:none !important; }
body.iphone-pop-open #reason-pop { visibility:visible; pointer-events:auto; }


/* 点击理由节点后仅显示已选节点链，输入聚焦后由更高优先级规则隐藏。 */
body.iphone-pop-open .content-box:not(.iphone-pop-path),
body.iphone-pop-open .reason-tag:not(.iphone-pop-path-tag) { visibility:hidden !important; }
body.iphone-pop-open .tree { left:50% !important; }

.tree { bottom:calc(env(safe-area-inset-bottom, 0px) + 137px); }


/* 输入文字与光标左对齐；便利贴继续使用其独立的居中样式。 */
#reason-pop textarea { text-align:left !important; }
#reason-pop { transition:none !important; }


/* Beta 8.6: fill the two rounded-corner gaps at the note/card junction.
   Both surfaces use the same solid fill, so the 14px overlap cannot darken. */
html.light-mode .node-row .reason-tag {
    background: #ffffff !important;
    box-shadow: 0 0 0 1px var(--switch-border);
}
html:not(.light-mode) .node-row .reason-tag {

.node-row .reason-tag::after {
    content: "";
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    bottom: -14px;
    height: 15px;

/* iPhone: 单行理由保持 40px；多行理由自然增高。 */

.node-row .reason-tag.above {

    padding: 8px !important;

/* 只在非输入状态居中展示；正在编辑时光标和文字保持左对齐。 */
#reason-pop textarea { text-align: left !important; }

/* iOS Safari: remove rectangular tap flash on input triggers and editable popover. */
html, body, .content-box, .check-btn, .reason-tag, #reason-pop,
#reason-input, .modal-input, .modal-btn, button, input, textarea,
[contenteditable], .realm-item, .toggle-84 {

}
#reason-input:focus, #reason-input:active,
.modal-input:focus, .modal-input:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (typeof html2canvas === 'undefined') {
                    alert('请连接网络以加载截图组件');
                    return;
                }
                const vw = window.innerWidth, vh = window.innerHeight;
                const rects = [...document.querySelectorAll('.content-box, .check-btn, .reason-tag')]
                    .filter(el => el.getClientRects().length).map(el => el.getBoundingClientRect());
                if (!rects.length) rects.push(tree.getBoundingClientRect());
                const pad = 28;
                const L = Math.max(0, Math.min(...rects.map(r => r.left)) - pad);
                const T = Math.max(0, Math.min(...rects.map(r => r.top)) - pad);
                const R = Math.min(vw, Math.max(...rects.map(r => r.right)) + pad);
                const B = Math.min(vh, Math.max(...rects.map(r => r.bottom)) + pad);
                html2canvas(document.body, {
                    backgroundColor: getComputedStyle(document.body).backgroundColor,
                    width: vw, height: vh, windowWidth: vw, windowHeight: vh,
                    onclone: d => {
                        const sh = d.getElementById('sheet');
                        if (sh) sh.style.transition = 'none';
                        ['grab', 'toast', 'reason-pop'].forEach(id => { const el = d.getElementById(id); if (el) el.style.display = 'none'; });
                        d.querySelectorAll('.reason-tag').forEach(el => { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; });
                        ['.toggle-84', '.realm-card'].forEach(q => { const el = d.querySelector(q); if (el) el.style.display = 'none'; });
                    }
                }).then(full => {
                    const k = full.width / vw;
                    const c = document.createElement('canvas');
                    c.width = Math.round((R - L) * k);
                    c.height = Math.round((B - T) * k);
                    c.getContext('2d').drawImage(full, L * k, T * k, (R - L) * k, (B - T) * k, 0, 0, c.width, c.height);
                    c.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
                            .then(() => showToast('已复制截屏', true))
                            .catch(() => alert('写入剪贴板失败'));
                    });
                });
            }
        });

        const sheet = document.getElementById('sheet');
        const tree = document.querySelector('.tree');
        const treeArea = document.getElementById('tree-area');
        function revealRight() { requestAnimationFrame(() => { fitIphoneTree(); scheduleWires(); }); }

        function toggleRealms() {
            const card = document.getElementById('realmCard');
            if (!card.classList.contains('show')) {
                const items = card.querySelectorAll('.realm-item');
                items.forEach(item => item.classList.remove('selected'));
            }
            card.classList.toggle('show');
        }

        // iOS: handle touch immediately and suppress the delayed synthetic click.
        function toggleSelection(el) { el.classList.toggle('selected'); }
        document.querySelectorAll('#realmCard .realm-item').forEach(item => {
            item.addEventListener('touchend', event => {
                event.preventDefault();
                toggleSelection(item);
            }, { passive: false });
        });

        let pendingCallback = null;
        let popAnchor = null;
        let popClosedAt = 0;
        let popCY = 0;
        let popAnchorOffset = 0;
        let suppressClickUntil = 0;
        let lastNodeClick = { el: null, t: 0 };
        const pop = document.getElementById('reason-pop');
        const popInput = document.getElementById('reason-input');

        let popGeometry = { height:50, bottom:0 };
        function cachePopGeometry() {
            if (!popAnchor) return;
            const r = popAnchor.getBoundingClientRect();
            // 浮窗与所点击节点的可见边缘始终保持 25px，
            // 不再误用父节点距离（可能包含 40px 的便利贴高度）。
            popGeometry = { height:r.height, bottom:r.top - 25 };
        }
        let popViewportHeight = innerHeight;
        let reasonKeyboardWasOpen = false;
        let keyboardSettling = false;
        let keyboardSettleTimer = null;
        function finishKeyboardPosition() {
            keyboardSettling = false;
            if (!pop.classList.contains('show')) return;
            fitPop();
            pop.style.opacity = '1';
        }
        // 节点同尺寸输入框；键盘打开时停靠于可视区域底部。
        function openInputModal(callback, placeholder, anchor) {
            reasonKeyboardWasOpen = false;
            popViewportHeight = Math.max(innerHeight, window.visualViewport ? window.visualViewport.height : 0);
            pendingCallback = callback;
            popAnchor = anchor || null;
            cachePopGeometry();
            popInput.value = '';
            popInput.placeholder = placeholder || '输入理由...';
            const r = anchor.getBoundingClientRect();
            const w = r.width;   // 浮窗与当前节点等宽
            pop.style.width = w + 'px';
            pop.style.minHeight = r.height + 'px';
            const padY = Math.max(6, (r.height - 2 - 19.6) / 2);
            pop.style.paddingTop = padY + 'px';
            pop.style.paddingBottom = padY + 'px';
            pop.style.height = '';
            popCY = r.top;
            popAnchorOffset = 0;
            pop.style.left = Math.max(8, (window.innerWidth - w) / 2) + 'px';
            fitPop();
            if (popAnchor) {
                // 保留当前节点及所有已连接的祖先节点，不显示未选择的同级分支。
                let row = popAnchor.closest('.node-row');
                while (row) {
                    const box = row.querySelector(':scope > .content-box');
                    if (box) {
                        box.classList.add('iphone-pop-path');
                        const tag = box.querySelector(':scope > .reason-tag');
                        if (tag && getComputedStyle(tag).display !== 'none') tag.classList.add('iphone-pop-path-tag');
                    }
                    // 临时折叠每层未选分支，让保留的节点链自然水平居中。
                    const siblings = row.parentElement;
                    if (siblings && siblings.classList.contains('node-group')) {
                        [...siblings.children].forEach(sibling => {
                            if (sibling !== row && sibling.classList.contains('node-row') && !sibling.classList.contains('hidden-sibling')) sibling.classList.add('iphone-pending-hide');
                        });
                    }
                    const group = row.parentElement.closest('.node-row');
                    row = group;
                }
            }
            // 首次点击节点只展示浮窗；点击输入框后由原生焦点事件进入输入模式。
            pop.classList.add('show');
            pop.style.visibility = 'visible';
            pop.style.opacity = '1';
            document.body.classList.add('iphone-pop-open');
            fitPop();
            drawWires();
            cachePopGeometry();
            positionPop();
            requestAnimationFrame(positionPop);
        }

        function closeInputModal() {
            keyboardSettling = false;
            clearTimeout(keyboardSettleTimer);
            pop.classList.remove('show');
            pop.style.removeProperty('visibility');
            pop.style.removeProperty('opacity');
            popInput.blur();
            document.body.classList.remove('iphone-pop-open', 'iphone-input-focused');
            document.querySelectorAll('.iphone-pending-hide').forEach(el => el.classList.remove('iphone-pending-hide'));
            document.querySelectorAll('.iphone-pop-path, .iphone-pop-path-tag, .iphone-pop-anchor').forEach(el => el.classList.remove('iphone-pop-path', 'iphone-pop-path-tag', 'iphone-pop-anchor'));
            pendingCallback = null;
            popClosedAt = Date.now();
            drawWires();
        }

        // 所有便利贴共用一个方向。只在碰到相应屏幕边界时切换，
        // 离开边界不复位；双击可随时手动集体切换。
        let reasonSideUpdating = false;
        let currentReasonSide = 'below'; // 初始位置始终在节点下方
        function updateReasonSides() {
            // 任意一张可见便利贴触顶或触底，所有可见便利贴同步淡化并隐藏文字。
            // 离开边界后一起恢复；隐藏的便利贴不参与触边判断。
            function syncReasonEdgeEffects() {
                const visibleTags = [...document.querySelectorAll('.reason-tag')]
                    .filter(tag => tag.getClientRects().length && getComputedStyle(tag).display !== 'none');
                const touching = visibleTags.some(tag => {
                    const r = tag.getBoundingClientRect();
                    return r.top <= 0 || r.bottom >= window.innerHeight;
                });
                document.querySelectorAll('.reason-tag').forEach(tag =>
                    tag.classList.toggle('edge-faded', touching && visibleTags.includes(tag)));
            }
            syncReasonEdgeEffects();
            // 只有当前决策链抵达叶节点后，拖动触边才自动切换。
            // 所有便利贴共享方向；离开边界时不恢复，避免反复跳动。
            if (!document.querySelector('.check-btn.leaf-btn.active') || reasonSideUpdating) return;
            const tags = [...document.querySelectorAll('.reason-tag')]
                .filter(t => getComputedStyle(t).display !== 'none' && t.closest('.content-box'));
            if (!tags.length) return;
            reasonSideUpdating = true;
            try {
                const edge = 6;
                const vh = window.innerHeight;
                // 只检测决策树节点，便利贴允许越过视口边缘。仅在当前方向对应的边界触发，
                // 切换后必须到另一侧边界才会再次切换。
                const nodes = [...document.querySelectorAll('.content-box')]
                    .filter(el => el.getClientRects().length);
                const rects = nodes.map(el => el.getBoundingClientRect());
                const hitBottom = rects.some(r => r.bottom >= vh - edge);
                const hitTop = rects.some(r => r.top <= edge);
                let next = currentReasonSide;
                if (currentReasonSide === 'below' && hitBottom) next = 'above';
                else if (currentReasonSide === 'above' && hitTop) next = 'below';
                if (next !== currentReasonSide) {
                    currentReasonSide = next;
                    tags.forEach(tag => tag.classList.toggle('above', next === 'above'));
                    // 切换位置后重新统一检测，确保所有便利贴的显示效果同步。
                    syncReasonEdgeEffects();
                    scheduleWires();
                }
            } finally { reasonSideUpdating = false; }
        }
        document.addEventListener('dblclick', e => {
            const tag = e.target.closest('.reason-tag');
            if (!tag) return;
            e.preventDefault(); e.stopPropagation();
            currentReasonSide = currentReasonSide === 'above' ? 'below' : 'above';
            document.querySelectorAll('.reason-tag').forEach(t => t.classList.toggle('above', currentReasonSide === 'above'));
            updateReasonSides();
            scheduleWires();
        }, true);

        // 便利贴每行最多 10 个字符；保留输入空格和手动换行，最大字号 12px。
        function layoutReason(tag, value) {
            tag.dataset.raw = value;
            tag.classList.add('above');
            tag.textContent = '';
            const text = document.createElement('div');
            text.className = 'note-text';
            text.textContent = value;
            tag.appendChild(text);
            scheduleWires();
        }

        function confirmPop() {
            const v = popInput.value;
            if (!v.trim() || !pendingCallback) return;
            const cb = pendingCallback;
            const textW = popInput.clientWidth;
            const anchor = popAnchor;
            cb(v);
            closeInputModal();
            const tag = anchor && anchor.querySelector('.reason-tag');
            if (tag) layoutReason(tag, v);
            drawWires();
            revealRight();
        }

        // 输入框高度随内容增加；到达屏幕底部时浮窗向上扩展，底边保持贴近视口。
        const measureCtx = document.createElement('canvas').getContext('2d');
        function positionPop() {
            if (!popAnchor) return;
            const vv = window.visualViewport;
            const vw = vv ? vv.width : innerWidth;
            const vh = vv ? vv.height : innerHeight;
            const ox = vv ? vv.offsetLeft : 0;
            const oy = vv ? vv.offsetTop : 0;
            const h = pop.offsetHeight;
            const docked = document.body.classList.contains('iphone-input-focused');
            const anchorTop = popAnchor.getBoundingClientRect().top;
            const bottom = docked ? oy + vh - 8 : Math.min(oy + vh - 8, anchorTop - 25);
            pop.style.left = (ox + (vw - pop.offsetWidth) / 2) + 'px';
            pop.style.top = Math.max(oy + 8, bottom - h) + 'px';
        }
        function fitPop() {
            if (!popAnchor) return;
            const vh = window.visualViewport ? window.visualViewport.height : innerHeight;
            const maxHeight = Math.max(50, vh - 16);
            popInput.style.height = '0px';
            const contentHeight = Math.max(18, popInput.scrollHeight);
            const height = Math.min(maxHeight, Math.max(50, contentHeight + 16));
            pop.style.height = height + 'px';
            popInput.style.height = Math.min(contentHeight, height - 18) + 'px';
            positionPop();
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                if (keyboardSettling) {
                    clearTimeout(keyboardSettleTimer);
                    keyboardSettleTimer = setTimeout(finishKeyboardPosition, 100);
                }
                if (pop.classList.contains('show')) {
                    const keyboardOpen = popViewportHeight - window.visualViewport.height > 100;
                    if (keyboardOpen) {
                        reasonKeyboardWasOpen = true;
                        document.body.classList.add('iphone-input-focused');
                    } else if (reasonKeyboardWasOpen) {
                        reasonKeyboardWasOpen = false;
                        document.body.classList.remove('iphone-input-focused');
                        scheduleWires();
                    }
                }
                fitPop();
            });
            window.visualViewport.addEventListener('scroll', positionPop);
        }
        popInput.addEventListener('focus', () => {
            // 键盘动画期间先隐藏浮窗，位置稳定后原位显示，避免两个定位模式切换时可见跳动。
            if (matchMedia('(pointer: coarse)').matches) {
                keyboardSettling = true;
                pop.style.opacity = '0';
                clearTimeout(keyboardSettleTimer);
                keyboardSettleTimer = setTimeout(finishKeyboardPosition, 450);
            }
            document.body.classList.add('iphone-input-focused');
            fitPop();
        });
        popInput.addEventListener('input', fitPop);
        const reasonNewline = document.getElementById('reason-newline');
        let lastReasonNewlineTouch = -Infinity;
        function insertReasonNewline() {
            popInput.setRangeText('\n', popInput.selectionStart, popInput.selectionEnd, 'end');
            popInput.focus();
            fitPop();
        }
        reasonNewline.addEventListener('pointerdown', event => event.preventDefault());
        reasonNewline.addEventListener('touchstart', event => {
            event.preventDefault();
            lastReasonNewlineTouch = performance.now();
            insertReasonNewline();
        }, {passive:false});
        reasonNewline.addEventListener('click', event => {
            event.preventDefault();
            if (performance.now() - lastReasonNewlineTouch < 800) return;
            insertReasonNewline();
        });

        // 拖动根节点可能让 textarea 失去焦点：只要浮窗仍打开，回车始终可以确认。
        // 在捕获阶段统一处理，避免焦点转移后 textarea 收不到 keydown。
        document.addEventListener('keydown', e => {
            if (!pop.classList.contains('show') || e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && e.target === reasonNewline) {
                e.preventDefault();
                e.stopPropagation();
                insertReasonNewline();
                return;
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                confirmPop();
            } else if (e.key === 'Escape') {

                closeInputModal();
            }
        }, true);
        document.addEventListener('pointerdown', e => {
            if (pop.classList.contains('show') && !e.target.closest('#reason-pop, #root-node > .content-box') && !popAnchor?.contains(e.target)) closeInputModal();
        });

        // iPhone 1D 方向选择：只移动唯一一份 4H 树，不复制 ID 或事件。
        const original4hGroup = document.querySelector('#root-node > .children-wrapper > .node-group');
        const directionTreeStash = document.createDocumentFragment();
        directionTreeStash.appendChild(original4hGroup);
        let dailyBothSelected = false;
        const directionGroup = document.createElement('div');
        directionGroup.className = 'node-group';
        directionGroup.innerHTML = `
            <div class="node-row" data-daily-direction="long">
                <div class="content-box">1d 做多 🔥<div class="reason-tag" id="r-daily-long"></div></div>
                <div class="check-btn" onclick="toggleNode(this, true, 'r-daily-long')">✔</div>
                <div class="children-wrapper"></div>
            </div>
            <div class="node-row" data-daily-direction="both">
                <div class="content-box">1d 多空 💧</div>
                <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                <div class="children-wrapper"></div>
            </div>
            <div class="node-row" data-daily-direction="short">
                <div class="content-box">1d 做空 ⚡️<div class="reason-tag" id="r-daily-short"></div></div>
                <div class="check-btn" onclick="toggleNode(this, true, 'r-daily-short')">✔</div>
                <div class="children-wrapper"></div>
            </div>`;
        document.querySelector('#root-node > .children-wrapper').appendChild(directionGroup);

        function resetFourHourState() {
            original4hGroup.querySelectorAll('.node-row').forEach(row => {
                row.classList.remove('has-children', 'single-mode', 'hidden-sibling', 'iphone-pending-hide');
                const btn = row.querySelector(':scope > .check-btn');
                if (btn) btn.classList.remove('active');
                const tag = row.querySelector(':scope > .content-box > .reason-tag');
                if (tag) tag.style.display = 'none';
                const wrapper = row.querySelector(':scope > .children-wrapper');
                if (wrapper) wrapper.style.display = 'none';
            });
        }
        function returnToDailyDirections() {
            if (!dailyBothSelected) return;
            if (pop.classList.contains('show')) closeInputModal();
            resetFourHourState();
            directionTreeStash.appendChild(original4hGroup);
            dailyBothSelected = false;
            const bothRow = directionGroup.querySelector('[data-daily-direction="both"]');
            bothRow.querySelector(':scope > .check-btn').classList.remove('active');
            bothRow.classList.remove('has-children', 'single-mode');
            bothRow.querySelector(':scope > .children-wrapper').style.display = 'none';
            directionGroup.querySelectorAll(':scope > .node-row').forEach(row => row.classList.remove('hidden-sibling'));
            directionGroup.style.display = '';
            document.querySelector('#root-node > .children-wrapper').style.display = 'block';
            revealRight();
        }

        // 点击节点即展开 / 收起(沿用原来的勾选逻辑,勾选框只是不再显示)
        function clickNode(box) {
            const b = box && box.parentElement.querySelector(':scope > .check-btn');
            if (b && typeof b.onclick === 'function') b.onclick.call(b);
        }
        // iOS 在真实 touchend 中执行需要理由的节点，避免隐藏按钮的合成 click。
        let reasonTouchStart = null;
        document.addEventListener('touchstart', e => {
            const t = e.touches[0];
            reasonTouchStart = t ? { x:t.clientX, y:t.clientY } : null;
        }, { passive:true });
        document.addEventListener('touchend', e => {
            const t = e.changedTouches[0];
            if (!t || !reasonTouchStart || Math.hypot(t.clientX-reasonTouchStart.x, t.clientY-reasonTouchStart.y)>10) return;
            const box = e.target.closest('.content-box');
            if (!box) return;
            // A second tap on the same fourth-level node while its editor is open
            // cancels the pending edit and returns to the choice list.
            if (pop.classList.contains('show')) {
                if (box === popAnchor) {
                    e.preventDefault();
                    suppressClickUntil = Date.now() + 500;
                    closeInputModal();
                }
                return;
            }
            // The visible sticky note is part of the selected node's hit area.
            // Tapping either the note or the card should allow re-selection.
            const b = box.parentElement.querySelector(':scope > .check-btn');
            if (!b) return;
            const handler = b.getAttribute('onclick') || '';
            if (!handler.includes('selectLeaf') && !/toggleNode\(this,\s*true/.test(handler)) return;
            e.preventDefault();
            suppressClickUntil = Date.now() + 500;
            clickNode(box);
        }, { passive:false });
        // 键盘上的“完成”通常使输入框失焦；与回车共用确认逻辑。
        popInput.addEventListener('blur', () => {
            keyboardSettling = false;
            clearTimeout(keyboardSettleTimer);
            if (pop.classList.contains('show')) pop.style.opacity = '1';
            document.body.classList.remove('iphone-input-focused');
            scheduleWires();
            setTimeout(() => {
                if (pop.classList.contains('show') && pendingCallback && popInput.value.trim() && document.activeElement !== popInput) confirmPop();
            }, 0);
        });
        document.addEventListener('click', e => {
            if (Date.now() < suppressClickUntil && e.target.closest('.content-box')) { e.stopPropagation(); e.preventDefault(); }
        }, true);

        document.addEventListener('contextmenu', e => {
            if (e.target.closest('#root-node > .content-box')) e.preventDefault();
        });
        document.addEventListener('click', e => {
            const box = e.target.closest('.content-box');
            if (!box) return;
            const now = Date.now();
            if (lastNodeClick.el === box && now - lastNodeClick.t < 600) return;   // 双击的第二下
            lastNodeClick = { el: box, t: now };
            if (popAnchor === box && now - popClosedAt < 300) return;               // 刚关掉浮窗时的点击
            if (box.matches('#root-node > .content-box')) {
                const b = box.parentElement.querySelector(':scope > .check-btn');
                if (dailyBothSelected) returnToDailyDirections();
                else if (b) clickNode(box);
                return;
            }
            clickNode(box);
        });


        function toggleNode(btn, needReason, reasonTagId) {
            let currentRow = btn.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');

            if (btn.classList.contains('active')) {
                resetSelection(currentRow, parentGroup);
                return;
            }

            const activate = (reasonText) => {
                if (reasonTagId && reasonText) {
                    let tag = document.getElementById(reasonTagId);
                    if (tag) {
                        tag.innerText = reasonText;
                        tag.style.display = "block";
                        tag.classList.toggle('above', currentReasonSide === 'above');
                    }
                }
                btn.classList.add('active');
                currentRow.classList.add('has-children');
                currentRow.classList.add('single-mode');
                let nextWrapper = currentRow.querySelector(':scope > .children-wrapper');
                if (currentRow.dataset.dailyDirection === 'both') {
                    dailyBothSelected = true;
                    directionGroup.style.display = 'none';
                    document.querySelector('#root-node > .children-wrapper').appendChild(original4hGroup);
                } else if (currentRow.dataset.dailyDirection && nextWrapper) {
                    nextWrapper.appendChild(original4hGroup);
                }
                if (nextWrapper) nextWrapper.style.display = 'block';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
                revealRight();
            };

            if (needReason) {
                openInputModal((reason) => { activate(reason); }, reasonTagId && reasonTagId.startsWith('r-daily-') ? 'Model Phase...' : (reasonTagId === 'r-fire' ? 'Model Phase...' : '1D/4H POI...'), currentRow.querySelector(':scope > .content-box'));
            } else {
                activate(null);
            }
        }

        function resetSelection(currentRow, parentGroup) {
            if (pop.classList.contains('show')) closeInputModal();
            if (currentRow.id === 'root-node' && dailyBothSelected) returnToDailyDirections();
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = currentRow.querySelector('.reason-tag');
            let nextWrapper = currentRow.querySelector('.children-wrapper');

            btn.classList.remove('active');
            currentRow.classList.remove('has-children');
            currentRow.classList.remove('single-mode');
            if (reasonTag) reasonTag.style.display = 'none';

            if (nextWrapper) {
                nextWrapper.style.display = 'none';
                nextWrapper.querySelectorAll('.node-row').forEach(row => {
                    row.classList.remove('has-children', 'single-mode', 'hidden-sibling');
                    let childBtn = row.querySelector('.check-btn');
                    if (childBtn) childBtn.classList.remove('active');
                    let childTag = row.querySelector('.reason-tag');
                    if (childTag) childTag.style.display = 'none';
                    let childWrapper = row.querySelector('.children-wrapper');
                    if (childWrapper) childWrapper.style.display = 'none';
                });
            }

            if (currentRow.dataset.dailyDirection) {
                resetFourHourState();
                directionTreeStash.appendChild(original4hGroup);
            }
            if (parentGroup) {
                for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
            }
        }


        function selectLeaf(el, reasonTagId) {
            let currentRow = el.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = reasonTagId ? document.getElementById(reasonTagId) : null;

            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentRow.classList.remove('single-mode');
                if (reasonTag) reasonTag.style.display = 'none';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
                }
                return;
            }

            openInputModal((reason) => {
                if (reasonTag) {
                    reasonTag.innerText = reason;
                    reasonTag.style.display = "block";
                }
                btn.classList.add('active');
                currentRow.classList.add('single-mode');
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
                revealRight();
            }, 'Model Phase...', currentRow.querySelector(':scope > .content-box'));
        }

        // 弧线连接:父节点右侧中点 → 每个可见子节点左侧中点
        const wires = document.getElementById('wires');
        let wireRaf = 0;
        function setStyle(el, prop, v) { if (el.style[prop] !== v) el.style[prop] = v; }
        function fitIphoneTree() {
            if (tree.style.getPropertyValue('--iphone-scale') !== '1') tree.style.setProperty('--iphone-scale', '1');
            document.querySelectorAll('.node-group').forEach(group => {
                const rows = [...group.children].filter(el => el.classList.contains('node-row'));
                const visible = rows.filter(el => !el.classList.contains('hidden-sibling') && !el.classList.contains('iphone-pending-hide'));
                group.classList.toggle('four-node-grid', visible.length === 4);
            });
        }
        function drawWires() {
            if (document.body.classList.contains('iphone-input-focused')) return;
            // 便利贴改为位于所属节点上方，节点至便利贴之间的线单独绘制。
            document.querySelectorAll('.reason-tag').forEach(tag => tag.classList.add('above'));
            document.querySelectorAll('.node-row').forEach(row => {
                const tag = row.querySelector(':scope > .content-box > .reason-tag');
                const shownTag = !!(tag && tag.getClientRects().length);
                if (shownTag) {
                    setStyle(tag, 'marginLeft', '');
                    setStyle(tag, 'marginTop', '');
                }
                const cbx = row.querySelector(':scope > .content-box');
                if (cbx) cbx.classList.toggle('has-reason', shownTag);
                const wrap = row.querySelector(':scope > .children-wrapper');
                if (wrap) setStyle(wrap, 'marginLeft', '');
            });
            // 按可见边缘计算 25px：父节点的便利贴向上伸出时，
            // 上一层子节点必须额外让出便利贴的实际高度。
            document.querySelectorAll('.node-group').forEach(group => {
                const parentRow = group.parentElement && group.parentElement.closest('.node-row');
                const parentBox = parentRow && parentRow.querySelector(':scope > .content-box');
                const parentTag = parentBox && parentBox.querySelector(':scope > .reason-tag');
                const noteHeight = parentTag && getComputedStyle(parentTag).display !== 'none'
                    ? parentTag.getBoundingClientRect().height / (parseFloat(tree.style.getPropertyValue('--iphone-scale')) || 1)
                    : 0;
                setStyle(group, 'paddingBottom', (25 + noteHeight) + 'px');
                setStyle(group, 'paddingTop', '0px');
            });
            fitIphoneTree();
            const t = tree.getBoundingClientRect();
            const scale = parseFloat(tree.style.getPropertyValue('--iphone-scale')) || 1;
            const mid = r => (r.top + r.height / 2 - t.top) / scale;
            let d = '';

            document.querySelectorAll('.node-row').forEach(row => {
                const wrap = row.querySelector(':scope > .children-wrapper');
                if (!wrap || wrap.style.display !== 'block') return;
                const pb = row.querySelector(':scope > .content-box');
                if (!pb || !pb.getClientRects().length || row.classList.contains('iphone-pending-hide')) return;
                if (document.body.classList.contains('iphone-pop-open') && !pb.classList.contains('iphone-pop-path')) return;
                const p = pb.getBoundingClientRect();
                const visibleTag = box => {
                    const tag = box.querySelector(':scope > .reason-tag');
                    return tag && tag.getClientRects().length && getComputedStyle(tag).display !== 'none'
                        ? tag.getBoundingClientRect() : null;
                };
                const pt = visibleTag(pb);
                const x1 = (p.left + p.width / 2 - t.left) / scale;
                const parentTop = (p.top - t.top) / scale;
                const parentNoteTop = pt ? (pt.top - t.top) / scale : null;
                const parentNoteBottom = pt ? (pt.bottom - t.top) / scale : null;
                // Node-to-note connection stays outside the sticky-note text.
                if (pt && parentTop > parentNoteBottom + .5) {
                    d += 'M' + x1 + ' ' + parentTop + 'L' + x1 + ' ' + parentNoteBottom;

                }
                const y1 = pt ? parentNoteTop : parentTop;
                wrap.querySelectorAll(':scope > .node-group > .node-row:not(.hidden-sibling)').forEach(ch => {
                    const cb = ch.querySelector(':scope > .content-box');
                    if (!cb || !cb.getClientRects().length || ch.classList.contains('iphone-pending-hide')) return;
                    if (document.body.classList.contains('iphone-pop-open') && !cb.classList.contains('iphone-pop-path')) return;
                    const c = cb.getBoundingClientRect();
                    const x2 = (c.left + c.width / 2 - t.left) / scale;
                    const childBottom = (c.bottom - t.top) / scale;
                    if (y1 > childBottom + .5) {
                        const my = (y1 + childBottom) / 2;
                        d += 'M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + childBottom;
                        // On a note-bearing node, mark the sticky-note edge instead of the card edge.

                    }
                });
            });
            // 每条上行连接线仅在前端（上方终点）绘制浅灰色空心圆。
            // An attached sticky note below its node is already connected from its lower edge

html.light-mode #xau-drawer .xau-keypad-grid button:active { background:#f6f8fa; }
@media (max-height:650px) {
  #xau-drawer .xau-title { margin-bottom:8px; }
  #xau-drawer .xau-result { height:80px; margin-bottom:8px; }
  #xau-drawer .xau-result-scroll { transform:translateY(-20px); }
  #xau-drawer .xau-field { margin-bottom:6px; }
  #xau-drawer .xau-field-header { min-height:36px; }
  #xau-drawer .xau-option-group { height:36px; }
  #xau-drawer .xau-input .xau-value { height:46px; }
}
</style>
<aside id="xau-drawer" aria-label="仓位计算器" aria-hidden="true" inert>
  <div class="xau-content">
  <div class="xau-content-inner">
    <div id="xau-result" class="xau-result" aria-live="polite"><span class="xau-result-scroll"><span id="xau-result-text">&nbsp;</span></span></div>
    <div class="xau-field">
      <div class="xau-field-header">
        <label for="xau-risk">风险</label>
        <div class="xau-option-group" role="group" aria-label="风险快捷金额"><button type="button" data-risk-preset="1" aria-pressed="true">1U</button><button type="button" data-risk-preset="4" aria-pressed="false">4U</button></div>
      </div>
      <div class="xau-input"><button id="xau-risk" class="xau-value" type="button" aria-label="风险" aria-controls="xau-keypad">1</button></div>
    </div>
    <div class="xau-field">
      <div class="xau-field-header">
        <label id="xau-stop-label" for="xau-direct-stop">止损<span id="xau-distance" role="status" aria-label="止损距离" aria-live="polite"></span></label>
        <div class="xau-option-group" role="group" aria-label="止损输入方式"><button type="button" data-stop-mode="direct" aria-pressed="true">输入</button><button type="button" data-stop-mode="prices" aria-pressed="false">计算</button></div>
      </div>
      <div id="xau-direct-box" class="xau-input xau-direct">
        <div class="xau-price-part"><button id="xau-direct-stop" class="xau-value" type="button" aria-label="止损距离" aria-controls="xau-keypad"></button></div>
      </div>
      <div id="xau-prices-box" class="xau-input xau-prices" hidden>
        <div class="xau-price-part"><button id="xau-entry" class="xau-value" type="button" aria-label="入场点位" aria-controls="xau-keypad"></button><span class="xau-price-measure" aria-hidden="true"></span><span class="xau-price-caret" aria-hidden="true"></span></div>
        <span class="xau-price-divider" aria-hidden="true"></span>
        <div class="xau-price-part"><button id="xau-stop" class="xau-value" type="button" aria-label="止损点位" aria-controls="xau-keypad"></button><span class="xau-price-measure" aria-hidden="true"></span><span class="xau-price-caret" aria-hidden="true"></span></div>
      </div>
    </div>
  <div id="xau-keypad" class="xau-keypad" role="group" aria-label="数字键盘">
    <div class="xau-keypad-grid">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <div class="xau-keypad-bottom"><button type="button" data-key="clear" aria-label="清空所有输入">×</button><button type="button" data-key="0">0</button><button type="button" data-key="backspace" aria-label="退格，长按清空当前输入">⌫</button></div>
    </div>
  </div>
  </div>
  </div>
</aside>
<script>
(function () {
  const drawer = document.getElementById('xau-drawer');
  const mainLayer = document.getElementById('xau-main-layer');
  const entryInput = document.getElementById('xau-entry');
  const stopInput = document.getElementById('xau-stop');
  const directStopInput = document.getElementById('xau-direct-stop');
  const riskInput = document.getElementById('xau-risk');
  const directBox = document.getElementById('xau-direct-box');
  const pricesBox = document.getElementById('xau-prices-box');
  const stopLabel = document.getElementById('xau-stop-label');
  const distanceText = document.getElementById('xau-distance');
  const resultText = document.getElementById('xau-result-text');
  const keypad = document.getElementById('xau-keypad');
  const riskPresetButtons = drawer.querySelectorAll('[data-risk-preset]');
  const calculatorInputs = [riskInput, directStopInput, entryInput, stopInput];
  calculatorInputs.forEach(field => {
    const name = field.getAttribute('aria-label');
    Object.defineProperty(field, 'value', {
      configurable:true,
      get() { return this.textContent; },
      set(value) {
        this.textContent = String(value);
        this.setAttribute('aria-label', name + (value ? '：' + value : ''));
        if (typeof this.scrollWidth === 'number') this.scrollLeft = this.scrollWidth;
      }
    });
    field.value = field.textContent;
    field.addEventListener('contextmenu', event => event.preventDefault());
  });
  let stopMode = 'direct';
  let selectedInput = riskInput;
  let replaceRiskOnNextDigit = true;
  function updatePriceCarets() {
    [entryInput, stopInput].forEach(input => {
      const part = input.closest('.xau-price-part');
      const measure = part.querySelector('.xau-price-measure');
      const caret = part.querySelector('.xau-price-caret');
      measure.textContent = input.value;
      if (typeof input.scrollWidth === 'number') input.scrollLeft = input.scrollWidth;
      if (part.clientWidth) caret.style.left = (7 + Math.min(measure.offsetWidth || 0, Math.max(0, part.clientWidth - 16))) + 'px';
    });
  }
  function selectInput(input) {
    selectedInput = input;
    const selectedBox = input.closest('.xau-input');
    calculatorInputs.forEach(field => {
      field.closest('.xau-input').classList.toggle('is-active', field.closest('.xau-input') === selectedBox);
      const pricePart = field.closest('.xau-price-part');
      if (pricePart) pricePart.classList.toggle('is-active', field === input);
    });
    updatePriceCarets();
  }
  calculatorInputs.forEach(input => {
    input.addEventListener('focus', () => selectInput(input));
    (input.closest('.xau-price-part') || input.closest('.xau-input')).addEventListener('click', () => selectInput(input));
  });
  selectInput(riskInput);
  function syncRiskPresets() {
    const amount = decimal(riskInput.value);
    riskPresetButtons.forEach(button => {
      const selected = amount !== null && amount[0] === BigInt(button.dataset.riskPreset) * amount[1];
      button.setAttribute('aria-pressed', String(selected));
    });
  }
  riskPresetButtons.forEach(button => button.addEventListener('click', () => {
    riskInput.value = button.dataset.riskPreset;
    replaceRiskOnNextDigit = true;
    calculate();
  }));
  keypad.closest('.xau-content-inner').querySelectorAll('[data-stop-mode]').forEach(button => button.addEventListener('click', () => {
    const mode = button.dataset.stopMode;
    if (mode === stopMode) return;
    directStopInput.value = '';
    entryInput.value = '';
    stopInput.value = '';
    stopMode = mode;
    directBox.hidden = mode !== 'direct';
    pricesBox.hidden = mode !== 'prices';
    stopLabel.setAttribute('for', mode === 'direct' ? 'xau-direct-stop' : 'xau-entry');
    keypad.closest('.xau-content-inner').querySelectorAll('[data-stop-mode]').forEach(option => option.setAttribute('aria-pressed', String(option.dataset.stopMode === mode)));
    if (selectedInput !== riskInput) selectInput(mode === 'direct' ? directStopInput : entryInput);
    calculate();
  }));
  function enterKey(key) {
    if (key === 'clear') {
      calculatorInputs.forEach(input => { input.value = ''; });
      replaceRiskOnNextDigit = false;
      calculate();
      return;
    }
    let value = selectedInput.value;
    if (selectedInput === riskInput && (/^\d$/.test(key) || ['clear-field', 'backspace', '.'].includes(key))) {
      if (replaceRiskOnNextDigit && /^\d$/.test(key)) value = '';
      replaceRiskOnNextDigit = false;
    }
    if (key === 'clear-field') value = '';
    else if (key === 'backspace') value = value.slice(0, -1);
    else if (key === '.') { if (!value.includes('.')) value = value ? value + '.' : '0.'; }
    else if (/^\d$/.test(key)) value = value === '0' ? key : value + key;
    if (value.length > 20) return;
    selectedInput.value = value;
    calculate();
  }
  const backspaceButton = keypad.querySelector('[data-key="backspace"]');
  let erasePress = null;
  let eraseHeld = false;
  let eraseCancelled = false;
  let eraseResetTimer = null;
  let suppressEraseMouseUntil = 0;
  function beginErase(point, identifier) {
    clearTimeout(eraseResetTimer);
    if (erasePress) clearTimeout(erasePress.timer);
    eraseHeld = false;
    eraseCancelled = false;
    const input = selectedInput;
    erasePress = { identifier, startX:point.clientX, startY:point.clientY, timer:setTimeout(() => {
      if (selectedInput !== input) { eraseCancelled = true; return; }
      input.value = '';
      eraseHeld = true;
      calculate();
    }, 600) };
  }
  function moveErase(point, identifier) {
    if (!erasePress || erasePress.identifier !== identifier) return;
    if (Math.hypot(point.clientX - erasePress.startX, point.clientY - erasePress.startY) > 12) {
      clearTimeout(erasePress.timer);
      eraseCancelled = true;
    }
  }
  function endErase(identifier, cancelled) {
    if (!erasePress || erasePress.identifier !== identifier) return;
    clearTimeout(erasePress.timer);
    erasePress = null;
    if (cancelled) eraseCancelled = true;
    if (eraseHeld || eraseCancelled) eraseResetTimer = setTimeout(() => { eraseHeld = false; eraseCancelled = false; }, 750);
  }
  if (window.PointerEvent) {
    backspaceButton.addEventListener('pointerdown', event => { if (event.button === 0) beginErase(event, event.pointerId); });
    document.addEventListener('pointermove', event => moveErase(event, event.pointerId));
    document.addEventListener('pointerup', event => endErase(event.pointerId, false));
    document.addEventListener('pointercancel', event => endErase(event.pointerId, true));
  } else {
    backspaceButton.addEventListener('touchstart', event => {
      if (event.touches.length === 1) beginErase(event.touches[0], event.touches[0].identifier);
    }, {passive:true});
    document.addEventListener('touchmove', event => {
      const touch = [...event.changedTouches].find(item => erasePress && item.identifier === erasePress.identifier);
      if (touch) moveErase(touch, touch.identifier);
    }, {passive:true});
    document.addEventListener('touchend', event => {
      const touch = [...event.changedTouches].find(item => erasePress && item.identifier === erasePress.identifier);
      if (touch) { endErase(touch.identifier, false); suppressEraseMouseUntil = performance.now() + 800; }
    }, {passive:true});
    document.addEventListener('touchcancel', event => {
      const touch = [...event.changedTouches].find(item => erasePress && item.identifier === erasePress.identifier);
      if (touch) { endErase(touch.identifier, true); suppressEraseMouseUntil = performance.now() + 800; }
    }, {passive:true});
    backspaceButton.addEventListener('mousedown', event => { if (event.button === 0 && performance.now() >= suppressEraseMouseUntil) beginErase(event, 'mouse'); });
    document.addEventListener('mousemove', event => { if (performance.now() >= suppressEraseMouseUntil) moveErase(event, 'mouse'); });
    document.addEventListener('mouseup', () => { if (performance.now() >= suppressEraseMouseUntil) endErase('mouse', false); });
  }
  backspaceButton.addEventListener('contextmenu', event => event.preventDefault());
  keypad.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => {
    if (button === backspaceButton && (eraseHeld || eraseCancelled)) { eraseHeld = false; eraseCancelled = false; return; }
    enterKey(button.dataset.key);
  }));
  drawer.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    let key = event.key;
    if (key === 'Backspace') key = 'backspace';
    if (key === 'Delete') key = 'clear-field';
    if (key === ',') key = '.';
    if (/^\d$/.test(key) || ['.', 'backspace', 'clear-field'].includes(key)) { event.preventDefault(); enterKey(key); }
  });
  function decimal(value) {
    const match = /^(\d+)(?:\.(\d*))?(?:e([+-]?\d+))?$/i.exec(value);
    if (!match) return null;
    const digits = BigInt(match[1] + (match[2] || ''));
    const scale = (match[2] || '').length - Number(match[3] || 0);
    if (Math.abs(scale) > 100) return null;
    return scale >= 0 ? [digits, 10n ** BigInt(scale)] : [digits * 10n ** BigInt(-scale), 1n];
  }
  function formatDistance(numerator, denominator) {
    const decimals = denominator.toString().length - 1;
    const digits = numerator.toString().padStart(decimals + 1, '0');
    if (!decimals) return digits;
    const fraction = digits.slice(-decimals).replace(/0+$/, '');
    return digits.slice(0, -decimals) + (fraction ? '.' + fraction : '');
  }
  function calculate() {
    updatePriceCarets();
    syncRiskPresets();
    const entry = decimal(entryInput.value);
    const stop = decimal(stopInput.value);
    const amount = decimal(riskInput.value);
    let distance = null;
    if (stopMode === 'direct') distance = decimal(directStopInput.value);
    else if (entry && stop) {
      const difference = entry[0] * stop[1] - stop[0] * entry[1];
      distance = [difference < 0n ? -difference : difference, entry[1] * stop[1]];
    }
    distanceText.textContent = stopMode === 'prices' && distance ? formatDistance(distance[0], distance[1]) : '';
    if (!distance || !distance[0] || !amount || !amount[0]) { resultText.textContent = '\u00a0'; return; }
    const steps = amount[0] * distance[1] * 100n / (amount[1] * distance[0]);
    if (steps < 1n) { resultText.textContent = '\u00a0'; return; }
    resultText.textContent = `${steps / 100n}.${String(steps % 100n).padStart(2, '0')}`;
  }
  calculatorInputs.forEach(input => input.addEventListener('input', calculate));
  let drawerOpen = false;
  let reveal = 0;
  let gesture = null;
  let suppressSwipeClickUntil = 0;
  let viewportWidth = window.innerWidth;
  let cornerResetTimer = null;
  const drawerWidth = () => Math.min(window.innerWidth * .82, 420);
  function renderReveal(position) {
    reveal = Math.max(0, Math.min(drawerWidth(), position));
    const progress = reveal / drawerWidth();
    mainLayer.style.setProperty('--reveal-x', reveal + 'px');
    mainLayer.style.setProperty('--reveal-progress', String(progress));
    const rounded = progress > 0 || document.body.classList.contains('xau-dragging') || document.body.classList.contains('xau-settling');
    mainLayer.style.setProperty('--reveal-radius', rounded ? '36px' : '0px');
    mainLayer.style.setProperty('--reveal-shadow-opacity', String(progress * .06));
    mainLayer.style.setProperty('--reveal-edge-opacity', String(progress * .04));
  }
  function setDrawer(open) {
    clearTimeout(cornerResetTimer);
    document.body.classList.toggle('xau-settling', !open && mainLayer.style.getPropertyValue('--reveal-radius') === '36px');
    drawerOpen = open;
    document.body.classList.remove('xau-dragging');
    document.body.classList.toggle('xau-open', open);
    if (!open && drawer.contains(document.activeElement)) document.activeElement.blur();
    drawer.inert = !open;
    drawer.setAttribute('aria-hidden', String(!open));
    renderReveal(open ? drawerWidth() : 0);
    if (!open) cornerResetTimer = setTimeout(finishDrawerClose, 320);
  }
  function finishDrawerClose() {
    if (drawerOpen || gesture?.moved) return;
    clearTimeout(cornerResetTimer);
    document.body.classList.remove('xau-settling');
    renderReveal(0);
  }
  mainLayer.addEventListener('transitionend', event => {
    if (event.target === mainLayer && event.propertyName === 'transform') finishDrawerClose();
  });
  function beginGesture(positionX, positionY, target, kind) {
    if (target.closest('input, textarea, button, label, a, [contenteditable], .toggle-84, .realm-card, .xau-result, .xau-risk-value, #reason-pop')) return;
    if (document.body.classList.contains('iphone-pop-open')) return;
    gesture = { startX:positionX, startY:positionY, origin:reveal, lastX:positionX, lastTime:performance.now(), velocity:0, moved:false, kind };
  }
  function moveGesture(positionX, positionY, event) {
    if (!gesture) return;
    const deltaX = positionX - gesture.startX;
    const deltaY = positionY - gesture.startY;
    if (!gesture.moved) {
      if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 12) return;
      if (Math.abs(deltaY) > Math.abs(deltaX) || (!drawerOpen && deltaX < 0)) { gesture = null; return; }
      gesture.moved = true;
      clearTimeout(cornerResetTimer);
      document.body.classList.remove('xau-settling');
      document.body.classList.add('xau-dragging');
    }
    if (event.cancelable) event.preventDefault();
    event.stopImmediatePropagation();
    const now = performance.now();
    const elapsed = now - gesture.lastTime;
    if (elapsed > 0) gesture.velocity = (positionX - gesture.lastX) / elapsed;
    gesture.lastX = positionX;
    gesture.lastTime = now;
    renderReveal(gesture.origin + deltaX);
  }
  function endGesture(event, cancelled) {
    if (!gesture) return;
    const finished = gesture;
    gesture = null;
    if (!finished.moved) return;
    if (event.cancelable) event.preventDefault();
    event.stopImmediatePropagation();
    suppressSwipeClickUntil = performance.now() + 250;
    let open = drawerOpen;
    if (!cancelled) {
      const distance = finished.lastX - finished.startX;
      const velocity = performance.now() - finished.lastTime < 120 ? finished.velocity : 0;
      open = Math.abs(distance) > 24 && Math.abs(velocity) > .3 ? distance > 0 : reveal > drawerWidth() * .35;
    }
    setDrawer(open);
  }
  document.addEventListener('touchstart', event => {
    if (event.touches.length !== 1) { gesture = null; return; }
    const touch = event.touches[0];
    beginGesture(touch.clientX, touch.clientY, event.target, 'touch');
  }, {capture:true, passive:true});
  document.addEventListener('touchmove', event => {
    if (event.touches.length !== 1) return;
    const touch = event.touches[0];
    moveGesture(touch.clientX, touch.clientY, event);
  }, {capture:true, passive:false});
  document.addEventListener('touchend', event => { endGesture(event, false); }, {capture:true, passive:false});
  document.addEventListener('touchcancel', event => { endGesture(event, true); }, {capture:true, passive:false});
  document.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button === 0) beginGesture(event.clientX, event.clientY, event.target, 'mouse');
  });
  document.addEventListener('pointermove', event => {
    if (gesture?.kind === 'mouse') moveGesture(event.clientX, event.clientY, event);
  }, true);
  document.addEventListener('pointerup', event => {
    if (gesture?.kind === 'mouse') endGesture(event, false);
  }, true);
  document.addEventListener('pointercancel', event => {
    if (gesture?.kind === 'mouse') endGesture(event, true);
  }, true);
  document.addEventListener('click', event => {
    if (performance.now() < suppressSwipeClickUntil) { event.preventDefault(); event.stopImmediatePropagation(); }
  }, true);
  document.getElementById('xau-shade').addEventListener('click', () => setDrawer(false));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') setDrawer(false);
  });
  window.addEventListener('resize', () => {
    updatePriceCarets();
    if (viewportWidth === window.innerWidth) return;
    viewportWidth = window.innerWidth;
    gesture = null;
    setDrawer(drawerOpen);
  });
})();
</script>
