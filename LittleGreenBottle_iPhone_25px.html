        /* 理由节点:根据可视空间显示在节点上方或下方 */

        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (typeof html2canvas === 'undefined') {
                    alert('请连接网络以加载截图组件');
                    return;
                }
                const vw = window.innerWidth, vh = window.innerHeight;
                const rects = [...document.querySelectorAll('.content-box, .check-btn, .reason-tag')]
                    .filter(el => el.getClientRects().length).map(el => el.getBoundingClientRect());
                if (!rects.length) rects.push(tree.getBoundingClientRect());
                const pad = 28;
                const L = Math.max(0, Math.min(...rects.map(r => r.left)) - pad);
                const T = Math.max(0, Math.min(...rects.map(r => r.top)) - pad);
                const R = Math.min(vw, Math.max(...rects.map(r => r.right)) + pad);
                const B = Math.min(vh, Math.max(...rects.map(r => r.bottom)) + pad);
                html2canvas(document.body, {
                    backgroundColor: getComputedStyle(document.body).backgroundColor,
                    width: vw, height: vh, windowWidth: vw, windowHeight: vh,
                    onclone: d => {
                        const sh = d.getElementById('sheet');
                        if (sh) sh.style.transition = 'none';
                        ['grab', 'toast', 'reason-pop'].forEach(id => { const el = d.getElementById(id); if (el) el.style.display = 'none'; });
                        d.querySelectorAll('.reason-tag').forEach(el => { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; });
                        ['.theme-switch', '.toggle-84', '.realm-card'].forEach(q => { const el = d.querySelector(q); if (el) el.style.display = 'none'; });
                    }
                }).then(full => {
                    const k = full.width / vw;
                    const c = document.createElement('canvas');
                    c.width = Math.round((R - L) * k);
                    c.height = Math.round((B - T) * k);
                    c.getContext('2d').drawImage(full, L * k, T * k, (R - L) * k, (B - T) * k, 0, 0, c.width, c.height);
                    c.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
                            .then(() => showToast('已复制截屏', true))
                            .catch(() => alert('写入剪贴板失败'));
                    });
                });
            }
        });

        const sheet = document.getElementById('sheet');
        const tree = document.querySelector('.tree');
        const treeArea = document.getElementById('tree-area');
        const rootEl = document.documentElement;

        let dragging = false;
        let lastDragEnd = 0;

        // 展开节点后,自动把右边新出现的内容滑进视野(手机上尤其需要)
        function revealRight() { requestAnimationFrame(() => { fitIphoneTree(); scheduleWires(); }); }

        function treeMoved() {
            return Math.abs(parseFloat(tree.style.getPropertyValue('--tx')) || 0) > 0.5 ||
                   Math.abs(parseFloat(tree.style.getPropertyValue('--ty')) || 0) > 0.5;
        }

        function trackPopDuringMotion() {
            const start = performance.now();
            const tick = () => {
                positionPop(); updateReasonSides();
                if (performance.now() - start < 450) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        function resetTree() {
            tree.style.removeProperty('--tx');
            tree.style.removeProperty('--ty');
            trackPopDuringMotion();
        }

        // 拖动「保护本金」:整棵决策树跟着走,但不能拖出网站边界
        document.addEventListener('pointerdown', e => {
            const box = e.target.closest('#root-node > .content-box');
            if (!box || dragging || e.button !== 0 || e.pointerType !== 'mouse') return;
            const sx = e.clientX, sy = e.clientY;
            const ox = parseFloat(tree.style.getPropertyValue('--tx')) || 0;
            const oy = parseFloat(tree.style.getPropertyValue('--ty')) || 0;
            const vw = window.innerWidth, vh = window.innerHeight, m = 6;
            const rs = [...document.querySelectorAll('.content-box, .check-btn')]
                .filter(el => el.getClientRects().length).map(el => el.getBoundingClientRect());
            const uL = Math.min(...rs.map(r => r.left)), uR = Math.max(...rs.map(r => r.right));
            const uT = Math.min(...rs.map(r => r.top)), uB = Math.max(...rs.map(r => r.bottom));
            let started = false;
            const move = ev => {
                const ddx = ev.clientX - sx, ddy = ev.clientY - sy;
                if (!started) {
                    if (Math.hypot(ddx, ddy) < 5) return;
                    started = true;
                    dragging = true;
                    rootEl.classList.add('tree-drag');
                }
                const cx = Math.min(vw - m - uR, Math.max(m - uL, ddx));
                const cy = Math.min(vh - m - uB, Math.max(m - uT, ddy));
                tree.style.setProperty('--tx', (ox + cx) + 'px');
                tree.style.setProperty('--ty', (oy + cy) + 'px');
                positionPop();
                updateReasonSides();
            };
            const up = () => {
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', up);
                window.removeEventListener('pointercancel', up);
                if (started) {
                    dragging = false;
                    lastDragEnd = Date.now();
                    suppressClickUntil = Date.now() + 300;
                    rootEl.classList.remove('tree-drag');
                    if (pop.classList.contains('show')) {
                        popInput.focus({ preventScroll: true });
                    }
                }
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
        });

        // Double-click the root or blank canvas to reset tree position.
        document.addEventListener('dblclick', e => {
            if (dragging || Date.now() - lastDragEnd < 450) return;
            if (e.target.closest('.reason-tag, .check-btn, .theme-switch, .toggle-84, .realm-card, .modal-overlay')) return;
            if (e.target.closest('.content-box') && !e.target.closest('#root-node > .content-box')) return;
            resetTree();
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function toggleRealms() {
            const card = document.getElementById('realmCard');
            if (!card.classList.contains('show')) {
                const items = card.querySelectorAll('.realm-item');
                items.forEach(item => item.classList.remove('selected'));
            }
            card.classList.toggle('show');
        }

        // iOS: handle touch immediately and suppress the delayed synthetic click.
        function toggleSelection(el) { el.classList.toggle('selected'); }
        document.querySelectorAll('.realm-item').forEach(item => {
            item.addEventListener('touchend', event => {
                event.preventDefault();
                toggleSelection(item);
            }, { passive: false });
        });

        let pendingCallback = null;
        let popAnchor = null;
        let popClosedAt = 0;
        let popCY = 0;
        let popAnchorOffset = 0;
        let suppressClickUntil = 0;
        let lastNodeClick = { el: null, t: 0 };
        let longPressFired = false;
        const pop = document.getElementById('reason-pop');
        const popInput = document.getElementById('reason-input');

        let popGeometry = { height:50, bottom:0 };
        function cachePopGeometry() {
            if (!popAnchor) return;
            const r = popAnchor.getBoundingClientRect();
            const row = popAnchor.closest('.node-row');
            const parentRow = row && row.parentElement.closest('.node-row');
            const parentBox = parentRow && parentRow.querySelector(':scope > .content-box');
            const parentRect = parentBox && parentBox.getBoundingClientRect();
            const measuredGap = parentRect ? parentRect.top - r.bottom : 25;
            popGeometry = { height:r.height, bottom:r.top - (measuredGap > 0 ? measuredGap : 25) };
        }
        let popViewportHeight = innerHeight;
        let reasonKeyboardWasOpen = false;
        let keyboardSettling = false;
        let keyboardSettleTimer = null;
        function finishKeyboardPosition() {
            keyboardSettling = false;
            if (!pop.classList.contains('show')) return;
            fitPop();
            pop.style.opacity = '1';
        }
        // 节点同尺寸输入框；键盘打开时停靠于可视区域底部。
        function openInputModal(callback, placeholder, anchor) {
            reasonKeyboardWasOpen = false;
            popViewportHeight = Math.max(innerHeight, window.visualViewport ? window.visualViewport.height : 0);
            pendingCallback = callback;
            popAnchor = anchor || null;
            cachePopGeometry();
            popInput.value = '';
            popInput.placeholder = placeholder || '输入理由...';
            const r = anchor.getBoundingClientRect();
            const w = r.width;   // 浮窗与当前节点等宽
            pop.style.width = w + 'px';
            pop.style.minHeight = r.height + 'px';
            const padY = Math.max(6, (r.height - 2 - 19.6) / 2);
            pop.style.paddingTop = padY + 'px';
            pop.style.paddingBottom = padY + 'px';
            pop.style.height = '';
            popCY = r.top;
            popAnchorOffset = 0;
            pop.style.left = Math.max(8, (window.innerWidth - w) / 2) + 'px';
            fitPop();
            if (popAnchor) {
                // 保留当前节点及所有已连接的祖先节点，不显示未选择的同级分支。
                let row = popAnchor.closest('.node-row');
                while (row) {
                    const box = row.querySelector(':scope > .content-box');
                    if (box) {
                        box.classList.add('iphone-pop-path');
                        const tag = box.querySelector(':scope > .reason-tag');
                        if (tag && getComputedStyle(tag).display !== 'none') tag.classList.add('iphone-pop-path-tag');
                    }
                    // 临时折叠每层未选分支，让保留的节点链自然水平居中。
                    const siblings = row.parentElement;
                    if (siblings && siblings.classList.contains('node-group')) {
                        [...siblings.children].forEach(sibling => {
                            if (sibling !== row && sibling.classList.contains('node-row') && !sibling.classList.contains('hidden-sibling')) sibling.classList.add('iphone-pending-hide');
                        });
                    }
                    const group = row.parentElement.closest('.node-row');
                    row = group;
                }
            }
            // 首次点击节点只展示浮窗；点击输入框后由原生焦点事件进入输入模式。
            pop.classList.add('show');
            pop.style.visibility = 'visible';
            pop.style.opacity = '1';
            document.body.classList.add('iphone-pop-open');
            fitPop();
            drawWires();
            cachePopGeometry();
            positionPop();
            requestAnimationFrame(positionPop);
        }

        function closeInputModal() {
            keyboardSettling = false;
            clearTimeout(keyboardSettleTimer);
            pop.classList.remove('show');
            pop.style.removeProperty('visibility');
            pop.style.removeProperty('opacity');
            popInput.blur();
            document.body.classList.remove('iphone-pop-open', 'iphone-input-focused');
            document.querySelectorAll('.iphone-pending-hide').forEach(el => el.classList.remove('iphone-pending-hide'));
            document.querySelectorAll('.iphone-pop-path, .iphone-pop-path-tag, .iphone-pop-anchor').forEach(el => el.classList.remove('iphone-pop-path', 'iphone-pop-path-tag', 'iphone-pop-anchor'));
            pendingCallback = null;
            popClosedAt = Date.now();
            drawWires();
        }

        // 所有便利贴共用一个方向。只在碰到相应屏幕边界时切换，
        // 离开边界不复位；双击可随时手动集体切换。
        let reasonSideUpdating = false;
        let currentReasonSide = 'below'; // 初始位置始终在节点下方
        function updateReasonSides() {
            // 任意一张可见便利贴触顶或触底，所有可见便利贴同步淡化并隐藏文字。
            // 离开边界后一起恢复；隐藏的便利贴不参与触边判断。
            function syncReasonEdgeEffects() {
                const visibleTags = [...document.querySelectorAll('.reason-tag')]
                    .filter(tag => tag.getClientRects().length && getComputedStyle(tag).display !== 'none');
                const touching = visibleTags.some(tag => {
                    const r = tag.getBoundingClientRect();
                    return r.top <= 0 || r.bottom >= window.innerHeight;
                });
                document.querySelectorAll('.reason-tag').forEach(tag =>
                    tag.classList.toggle('edge-faded', touching && visibleTags.includes(tag)));
            }
            syncReasonEdgeEffects();
            // 只有当前决策链抵达叶节点后，拖动触边才自动切换。
            // 所有便利贴共享方向；离开边界时不恢复，避免反复跳动。
            if (!document.querySelector('.check-btn.leaf-btn.active') || reasonSideUpdating) return;
            const tags = [...document.querySelectorAll('.reason-tag')]
                .filter(t => getComputedStyle(t).display !== 'none' && t.closest('.content-box'));
            if (!tags.length) return;
            reasonSideUpdating = true;
            try {
                const edge = 6;
                const vh = window.innerHeight;
                // 只检测决策树节点，便利贴允许越过视口边缘。仅在当前方向对应的边界触发，
                // 切换后必须到另一侧边界才会再次切换。
                const nodes = [...document.querySelectorAll('.content-box')]
                    .filter(el => el.getClientRects().length);
                const rects = nodes.map(el => el.getBoundingClientRect());
                const hitBottom = rects.some(r => r.bottom >= vh - edge);
                const hitTop = rects.some(r => r.top <= edge);
                let next = currentReasonSide;
                if (currentReasonSide === 'below' && hitBottom) next = 'above';
                else if (currentReasonSide === 'above' && hitTop) next = 'below';
                if (next !== currentReasonSide) {
                    currentReasonSide = next;
                    tags.forEach(tag => tag.classList.toggle('above', next === 'above'));
                    // 切换位置后重新统一检测，确保所有便利贴的显示效果同步。
                    syncReasonEdgeEffects();
                    scheduleWires();
                }
            } finally { reasonSideUpdating = false; }
        }
        document.addEventListener('dblclick', e => {
            const tag = e.target.closest('.reason-tag');
            if (!tag) return;
            e.preventDefault(); e.stopPropagation();
            currentReasonSide = currentReasonSide === 'above' ? 'below' : 'above';
            document.querySelectorAll('.reason-tag').forEach(t => t.classList.toggle('above', currentReasonSide === 'above'));
            updateReasonSides();
            scheduleWires();
        }, true);

        // 便利贴每行最多 10 个字符；保留输入空格和手动换行，最大字号 12px。
        function layoutReason(tag, value) {
            tag.dataset.raw = value;
            tag.classList.add('above');
            tag.textContent = '';
            const text = document.createElement('div');
            text.className = 'note-text';
            text.textContent = value;
            tag.appendChild(text);
            scheduleWires();
        }

        function confirmPop() {
            const v = popInput.value;
            if (!v.trim() || !pendingCallback) return;
            const cb = pendingCallback;
            const textW = popInput.clientWidth;
            const anchor = popAnchor;
            cb(v);
            closeInputModal();
            const tag = anchor && anchor.querySelector('.reason-tag');
            if (tag) layoutReason(tag, v);
            drawWires();
            revealRight();
        }

        // 输入框高度随内容增加；到达屏幕底部时浮窗向上扩展，底边保持贴近视口。
        const measureCtx = document.createElement('canvas').getContext('2d');
        function positionPop() {
            if (!popAnchor) return;
            const vv = window.visualViewport;
            const vw = vv ? vv.width : innerWidth;
            const vh = vv ? vv.height : innerHeight;
            const ox = vv ? vv.offsetLeft : 0;
            const oy = vv ? vv.offsetTop : 0;
            const h = pop.offsetHeight;
            const docked = document.body.classList.contains('iphone-input-focused');
            const bottom = docked ? oy + vh - 8 : Math.min(oy + vh - 8, popGeometry.bottom);
            pop.style.left = (ox + (vw - pop.offsetWidth) / 2) + 'px';
            pop.style.top = Math.max(oy + 8, bottom - h) + 'px';
        }
        function fitPop() {
            if (!popAnchor) return;
            const vh = window.visualViewport ? window.visualViewport.height : innerHeight;
            const maxHeight = Math.max(50, vh - 16);
            popInput.style.height = '0px';
            const contentHeight = Math.max(18, popInput.scrollHeight);
            const height = Math.min(maxHeight, Math.max(50, contentHeight + 16));
            pop.style.height = height + 'px';
            popInput.style.height = Math.min(contentHeight, height - 18) + 'px';
            positionPop();
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                if (keyboardSettling) {
                    clearTimeout(keyboardSettleTimer);
                    keyboardSettleTimer = setTimeout(finishKeyboardPosition, 100);
                }
                if (pop.classList.contains('show')) {
                    const keyboardOpen = popViewportHeight - window.visualViewport.height > 100;
                    if (keyboardOpen) {
                        reasonKeyboardWasOpen = true;
                        document.body.classList.add('iphone-input-focused');
                    } else if (reasonKeyboardWasOpen) {
                        reasonKeyboardWasOpen = false;
                        document.body.classList.remove('iphone-input-focused');
                        scheduleWires();
                    }
                }
                fitPop();
            });
            window.visualViewport.addEventListener('scroll', positionPop);
        }
        popInput.addEventListener('focus', () => {
            // 键盘动画期间先隐藏浮窗，位置稳定后原位显示，避免两个定位模式切换时可见跳动。
            if (matchMedia('(pointer: coarse)').matches) {
                keyboardSettling = true;
                pop.style.opacity = '0';
                clearTimeout(keyboardSettleTimer);
                keyboardSettleTimer = setTimeout(finishKeyboardPosition, 450);
            }
            document.body.classList.add('iphone-input-focused');
            fitPop();
        });
        popInput.addEventListener('input', fitPop);

        // 拖动根节点可能让 textarea 失去焦点：只要浮窗仍打开，回车始终可以确认。
        // 在捕获阶段统一处理，避免焦点转移后 textarea 收不到 keydown。
        document.addEventListener('keydown', e => {
            if (!pop.classList.contains('show') || e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                confirmPop();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeInputModal();
            }
        }, true);
        document.addEventListener('pointerdown', e => {
            if (pop.classList.contains('show') && !e.target.closest('#reason-pop, #root-node > .content-box') && !popAnchor?.contains(e.target)) closeInputModal();
        });

        // iPhone 1D 方向选择：只移动唯一一份 4H 树，不复制 ID 或事件。
        const original4hGroup = document.querySelector('#root-node > .children-wrapper > .node-group');
        const directionTreeStash = document.createDocumentFragment();
        directionTreeStash.appendChild(original4hGroup);
        let dailyBothSelected = false;
        const directionGroup = document.createElement('div');
        directionGroup.className = 'node-group';
        directionGroup.innerHTML = `
            <div class="node-row" data-daily-direction="long">
                <div class="content-box">1d 做多 🔥<div class="reason-tag" id="r-daily-long"></div></div>
                <div class="check-btn" onclick="toggleNode(this, true, 'r-daily-long')">✔</div>
                <div class="children-wrapper"></div>
            </div>
            <div class="node-row" data-daily-direction="both">
                <div class="content-box">1d 多空 💧</div>
                <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                <div class="children-wrapper"></div>
            </div>
            <div class="node-row" data-daily-direction="short">
                <div class="content-box">1d 做空 ⚡️<div class="reason-tag" id="r-daily-short"></div></div>
                <div class="check-btn" onclick="toggleNode(this, true, 'r-daily-short')">✔</div>
                <div class="children-wrapper"></div>
            </div>`;
        document.querySelector('#root-node > .children-wrapper').appendChild(directionGroup);

        function resetFourHourState() {
            original4hGroup.querySelectorAll('.node-row').forEach(row => {
                row.classList.remove('has-children', 'single-mode', 'hidden-sibling', 'iphone-pending-hide');
                const btn = row.querySelector(':scope > .check-btn');
                if (btn) btn.classList.remove('active');
                const tag = row.querySelector(':scope > .content-box > .reason-tag');
                if (tag) tag.style.display = 'none';
                const wrapper = row.querySelector(':scope > .children-wrapper');
                if (wrapper) wrapper.style.display = 'none';
            });
        }
        function returnToDailyDirections() {
            if (!dailyBothSelected) return;
            if (pop.classList.contains('show')) closeInputModal();
            resetFourHourState();
            directionTreeStash.appendChild(original4hGroup);
            dailyBothSelected = false;
            const bothRow = directionGroup.querySelector('[data-daily-direction="both"]');
            bothRow.querySelector(':scope > .check-btn').classList.remove('active');
            bothRow.classList.remove('has-children', 'single-mode');
            bothRow.querySelector(':scope > .children-wrapper').style.display = 'none';
            directionGroup.querySelectorAll(':scope > .node-row').forEach(row => row.classList.remove('hidden-sibling'));
            directionGroup.style.display = '';
            document.querySelector('#root-node > .children-wrapper').style.display = 'block';
            revealRight();
        }

        // 点击节点即展开 / 收起(沿用原来的勾选逻辑,勾选框只是不再显示)
        function clickNode(box) {
            const b = box && box.parentElement.querySelector(':scope > .check-btn');
            if (b && typeof b.onclick === 'function') b.onclick.call(b);
        }
        // iOS 在真实 touchend 中执行需要理由的节点，避免隐藏按钮的合成 click。
        let reasonTouchStart = null;
        document.addEventListener('touchstart', e => {
            const t = e.touches[0];
            reasonTouchStart = t ? { x:t.clientX, y:t.clientY } : null;
        }, { passive:true });
        document.addEventListener('touchend', e => {
            const t = e.changedTouches[0];
            if (!t || !reasonTouchStart || Math.hypot(t.clientX-reasonTouchStart.x, t.clientY-reasonTouchStart.y)>10) return;
            const box = e.target.closest('.content-box');
            if (!box) return;
            // A second tap on the same fourth-level node while its editor is open
            // cancels the pending edit and returns to the choice list.
            if (pop.classList.contains('show')) {
                if (box === popAnchor) {
                    e.preventDefault();
                    suppressClickUntil = Date.now() + 500;
                    closeInputModal();
                }
                return;
            }
            // The visible sticky note is part of the selected node's hit area.
            // Tapping either the note or the card should allow re-selection.
            const b = box.parentElement.querySelector(':scope > .check-btn');
            if (!b) return;
            const handler = b.getAttribute('onclick') || '';
            if (!handler.includes('selectLeaf') && !/toggleNode\(this,\s*true/.test(handler)) return;
            e.preventDefault();
            suppressClickUntil = Date.now() + 500;
            clickNode(box);
        }, { passive:false });
        // 键盘上的“完成”通常使输入框失焦；与回车共用确认逻辑。
        popInput.addEventListener('blur', () => {
            keyboardSettling = false;
            clearTimeout(keyboardSettleTimer);
            if (pop.classList.contains('show')) pop.style.opacity = '1';
            document.body.classList.remove('iphone-input-focused');
            scheduleWires();
            setTimeout(() => {
                if (pop.classList.contains('show') && pendingCallback && popInput.value.trim() && document.activeElement !== popInput) confirmPop();
            }, 0);
        });
        document.addEventListener('click', e => {
            if (Date.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
        }, true);

        // 长按「保护本金」0.7 秒:收起整棵树(前 0.2 秒不显示进度圈;移动超过 5 像素视为拖动,不触发)
        document.addEventListener('pointerdown', e => {
            const box = e.target.closest('#root-node > .content-box');
            if (!box || e.button !== 0 || e.pointerType === 'touch') return;
            const sx = e.clientX, sy = e.clientY;
            const btn0 = box.parentElement.querySelector(':scope > .check-btn');
            // 按住超过 0.2 秒且没有移动,才显示进度圈(双击、拖动都不会出现)
            const showTimer = setTimeout(() => {
                if (!dragging && btn0 && btn0.classList.contains('active')) box.classList.add('pressing');
            }, 200);
            const timer = setTimeout(() => {
                box.classList.remove('pressing');
                const b = box.parentElement.querySelector(':scope > .check-btn');
                if (dragging || !b || !b.classList.contains('active')) return;
                clickNode(box);
                longPressFired = true;
            }, 700);
            const mv = ev => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 5) done(); };
            const done = () => {
                clearTimeout(showTimer);
                clearTimeout(timer);
                box.classList.remove('pressing');
                window.removeEventListener('pointermove', mv);
                window.removeEventListener('pointerup', done);
                window.removeEventListener('pointercancel', done);
                if (longPressFired) { longPressFired = false; suppressClickUntil = Date.now() + 350; }
            };
            window.addEventListener('pointermove', mv);
            window.addEventListener('pointerup', done);
            window.addEventListener('pointercancel', done);
        });
        document.addEventListener('contextmenu', e => {
            if (e.target.closest('#root-node > .content-box')) e.preventDefault();
        });
        document.addEventListener('click', e => {
            const box = e.target.closest('.content-box');
            if (!box) return;
            const now = Date.now();
            if (lastNodeClick.el === box && now - lastNodeClick.t < 600) return;   // 双击的第二下
            lastNodeClick = { el: box, t: now };
            if (popAnchor === box && now - popClosedAt < 300) return;               // 刚关掉浮窗时的点击
            if (box.matches('#root-node > .content-box')) {
                // 「保护本金」:单击只负责展开(已展开就不动);收起用长按;双击复位位置
                const b = box.parentElement.querySelector(':scope > .check-btn');
                if (dailyBothSelected) returnToDailyDirections();
                else if (b) clickNode(box);
                return;
            }
            clickNode(box);
        });


        function toggleNode(btn, needReason, reasonTagId) {
            let currentRow = btn.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');

            if (btn.classList.contains('active')) {
                resetSelection(currentRow, parentGroup);
                return;
            }

            const activate = (reasonText) => {
                if (reasonTagId && reasonText) {
                    let tag = document.getElementById(reasonTagId);
                    if (tag) {
                        tag.innerText = reasonText;
                        tag.style.display = "block";
                        tag.classList.toggle('above', currentReasonSide === 'above');
                    }
                }
                btn.classList.add('active');
                currentRow.classList.add('has-children');
                currentRow.classList.add('single-mode');
                let nextWrapper = currentRow.querySelector(':scope > .children-wrapper');
                if (currentRow.dataset.dailyDirection === 'both') {
                    dailyBothSelected = true;
                    directionGroup.style.display = 'none';
                    document.querySelector('#root-node > .children-wrapper').appendChild(original4hGroup);
                } else if (currentRow.dataset.dailyDirection && nextWrapper) {
                    nextWrapper.appendChild(original4hGroup);
                }
                if (nextWrapper) nextWrapper.style.display = 'block';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
                revealRight();
            };

            if (needReason) {
                openInputModal((reason) => { activate(reason); }, reasonTagId && reasonTagId.startsWith('r-daily-') ? 'Model Phase...' : (reasonTagId === 'r-fire' ? 'Model Phase...' : '1D/4H POI...'), currentRow.querySelector(':scope > .content-box'));
            } else {
                activate(null);
            }
        }

        function resetSelection(currentRow, parentGroup) {
            if (pop.classList.contains('show')) closeInputModal();
            if (currentRow.id === 'root-node' && dailyBothSelected) returnToDailyDirections();
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = currentRow.querySelector('.reason-tag');
            let nextWrapper = currentRow.querySelector('.children-wrapper');

            btn.classList.remove('active');
            currentRow.classList.remove('has-children');
            currentRow.classList.remove('single-mode');
            if (reasonTag) reasonTag.style.display = 'none';

            if (nextWrapper) {
                nextWrapper.style.display = 'none';
                nextWrapper.querySelectorAll('.node-row').forEach(row => {
                    row.classList.remove('has-children', 'single-mode', 'hidden-sibling');
                    let childBtn = row.querySelector('.check-btn');
                    if (childBtn) childBtn.classList.remove('active');
                    let childTag = row.querySelector('.reason-tag');
                    if (childTag) childTag.style.display = 'none';
                    let childWrapper = row.querySelector('.children-wrapper');
                    if (childWrapper) childWrapper.style.display = 'none';
                });
            }

            if (currentRow.dataset.dailyDirection) {
                resetFourHourState();
                directionTreeStash.appendChild(original4hGroup);
            }
            if (parentGroup) {
                for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
            }
        }


        function selectLeaf(el, reasonTagId) {
            let currentRow = el.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = reasonTagId ? document.getElementById(reasonTagId) : null;

            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentRow.classList.remove('single-mode');
                if (reasonTag) reasonTag.style.display = 'none';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
                }
                return;
            }

            openInputModal((reason) => {
                if (reasonTag) {
                    reasonTag.innerText = reason;
                    reasonTag.style.display = "block";
                }
                btn.classList.add('active');
                currentRow.classList.add('single-mode');
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
                revealRight();
            }, 'Model Phase...', currentRow.querySelector(':scope > .content-box'));
        }

        // 弧线连接:父节点右侧中点 → 每个可见子节点左侧中点
        const wires = document.getElementById('wires');
        let wireRaf = 0;
        // 决策树不能溢出屏幕:按动画结束后的最终位置计算,超出就推回来(内容比屏幕还大时不处理)
        function matrixOf(el) {
            const t = getComputedStyle(el).transform;
            return t && t !== 'none' ? new DOMMatrix(t) : new DOMMatrix();
        }
        function clampTree() {
            const els = [...document.querySelectorAll('.content-box')].filter(el => el.getClientRects().length);
            if (!els.length) return;
            const m = 6, vw = window.innerWidth, vh = window.innerHeight;
            const tx = parseFloat(tree.style.getPropertyValue('--tx')) || 0;
            const ty = parseFloat(tree.style.getPropertyValue('--ty')) || 0;
            const tm = matrixOf(tree), sm = matrixOf(sheet);
            const sTarget = 0;
            const dx = tx - tm.m41, dy = (ty - tm.m42) + (sTarget - sm.m42);
            let L = Infinity, T = Infinity, R = -Infinity, B = -Infinity;
            els.forEach(el => {
                const r = el.getBoundingClientRect();
                L = Math.min(L, r.left + dx); R = Math.max(R, r.right + dx);
                T = Math.min(T, r.top + dy); B = Math.max(B, r.bottom + dy);
            });
            let nx = tx, ny = ty;
            if (R - L <= vw - 2 * m) { if (L < m) nx += m - L; else if (R > vw - m) nx -= R - (vw - m); }
            if (B - T <= vh - 2 * m) { if (T < m) ny += m - T; else if (B > vh - m) ny -= B - (vh - m); }
            if (Math.abs(nx - tx) > 0.5) tree.style.setProperty('--tx', nx + 'px');
            if (Math.abs(ny - ty) > 0.5) tree.style.setProperty('--ty', ny + 'px');
        }

        function setStyle(el, prop, v) { if (el.style[prop] !== v) el.style[prop] = v; }
        function fitIphoneTree() {
            if (tree.style.getPropertyValue('--iphone-scale') !== '1') tree.style.setProperty('--iphone-scale', '1');
            document.querySelectorAll('.node-group').forEach(group => {
                const rows = [...group.children].filter(el => el.classList.contains('node-row'));
                const visible = rows.filter(el => !el.classList.contains('hidden-sibling') && !el.classList.contains('iphone-pending-hide'));
                group.classList.toggle('four-node-grid', visible.length === 4);
            });
        }
        function drawWires() {
            if (document.body.classList.contains('iphone-input-focused')) return;
            // 便利贴改为位于所属节点上方，节点至便利贴之间的线单独绘制。
            document.querySelectorAll('.reason-tag').forEach(tag => tag.classList.add('above'));
            document.querySelectorAll('.node-row').forEach(row => {
                const tag = row.querySelector(':scope > .content-box > .reason-tag');
                const shownTag = !!(tag && tag.getClientRects().length);
                if (shownTag) {
                    setStyle(tag, 'marginLeft', '');
                    setStyle(tag, 'marginTop', '');
                }
                const cbx = row.querySelector(':scope > .content-box');
                if (cbx) cbx.classList.toggle('has-reason', shownTag);
                const wrap = row.querySelector(':scope > .children-wrapper');
                if (wrap) setStyle(wrap, 'marginLeft', '');
            });
            // 每一层只计算相邻可见表面的净空：普通节点或便利贴到上一节点均为 25px。
            // 便利贴贴在所属节点上方，属于同一组，不在两者之间额外留白。
            document.querySelectorAll('.node-group').forEach(group => {
                const parentRow = group.parentElement && group.parentElement.closest('.node-row');
                const parentBox = parentRow && parentRow.querySelector(':scope > .content-box');
                if (!parentBox) return;
                const tag = parentBox.querySelector(':scope > .reason-tag');
                const noteVisible = tag && tag.getClientRects().length && getComputedStyle(tag).display !== 'none';
                const scaleNow = parseFloat(tree.style.getPropertyValue('--iphone-scale')) || 1;
                // CSS 中的便利贴紧贴节点；测量其真实顶部以适配 40px 单行和自动增高的多行。
                const parentTop = parentBox.getBoundingClientRect().top;
                const surfaceTop = noteVisible ? tag.getBoundingClientRect().top : parentTop;
                const noteExtension = Math.max(0, (parentTop - surfaceTop) / scaleNow);
                const clearance = Math.ceil(25 + noteExtension);
                setStyle(group, 'paddingBottom', clearance + 'px');
                setStyle(group, 'paddingTop', '0px');
            });
            fitIphoneTree();
            const t = tree.getBoundingClientRect();
            const scale = parseFloat(tree.style.getPropertyValue('--iphone-scale')) || 1;
            const mid = r => (r.top + r.height / 2 - t.top) / scale;
            let d = '';

            document.querySelectorAll('.node-row').forEach(row => {
                const wrap = row.querySelector(':scope > .children-wrapper');
                if (!wrap || wrap.style.display !== 'block') return;
                const pb = row.querySelector(':scope > .content-box');
                if (!pb || !pb.getClientRects().length || row.classList.contains('iphone-pending-hide')) return;
                if (document.body.classList.contains('iphone-pop-open') && !pb.classList.contains('iphone-pop-path')) return;
                const p = pb.getBoundingClientRect();
                const visibleTag = box => {
                    const tag = box.querySelector(':scope > .reason-tag');
                    return tag && tag.getClientRects().length && getComputedStyle(tag).display !== 'none'
                        ? tag.getBoundingClientRect() : null;
                };
                const pt = visibleTag(pb);
                const x1 = (p.left + p.width / 2 - t.left) / scale;
                const parentTop = (p.top - t.top) / scale;
                const parentNoteTop = pt ? (pt.top - t.top) / scale : null;
                const parentNoteBottom = pt ? (pt.bottom - t.top) / scale : null;
                // Node-to-note connection stays outside the sticky-note text.
                if (pt && parentTop > parentNoteBottom + .5) {
                    d += 'M' + x1 + ' ' + parentTop + 'L' + x1 + ' ' + parentNoteBottom;

                }
                const y1 = pt ? parentNoteTop : parentTop;
                wrap.querySelectorAll(':scope > .node-group > .node-row:not(.hidden-sibling)').forEach(ch => {
                    const cb = ch.querySelector(':scope > .content-box');
                    if (!cb || !cb.getClientRects().length || ch.classList.contains('iphone-pending-hide')) return;
                    if (document.body.classList.contains('iphone-pop-open') && !cb.classList.contains('iphone-pop-path')) return;
                    const c = cb.getBoundingClientRect();
                    const x2 = (c.left + c.width / 2 - t.left) / scale;
                    const childBottom = (c.bottom - t.top) / scale;
                    if (y1 > childBottom + .5) {
                        const my = (y1 + childBottom) / 2;
                        d += 'M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + childBottom;
                        // On a note-bearing node, mark the sticky-note edge instead of the card edge.

                    }
                });
            });
            // 每条上行连接线仅在前端（上方终点）绘制浅灰色空心圆。
            // An attached sticky note below its node is already connected from its lower edge
            // to its parent by the main path; the node-to-note overlap must not be crossed by a wire.
            wires.setAttribute('viewBox', '0 0 ' + Math.max(1, tree.offsetWidth) + ' ' + Math.max(1, tree.offsetHeight));
            // 仅绘制连接线，不生成任何端点空心圆。
            wires.innerHTML = '<path d="' + d + '"/>';
            positionPop();
            updateReasonSides();
        }
        function scheduleWires() {
            cancelAnimationFrame(wireRaf);
            if (document.body.classList.contains('iphone-input-focused')) return;
            wireRaf = requestAnimationFrame(drawWires);
        }
        new MutationObserver(scheduleWires).observe(treeArea, { attributes: true, subtree: true, attributeFilter: ['class', 'style'] });
        new ResizeObserver(scheduleWires).observe(tree);
        window.addEventListener('resize', () => { fitPop(); if (!document.body.classList.contains('iphone-input-focused')) { updateReasonSides(); scheduleWires(); } });
        if (document.fonts) document.fonts.ready.then(scheduleWires);
        scheduleWires();

        function showToast(msg, immediate) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
