    <script>
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (typeof html2canvas === 'undefined') {
                    alert('请连接网络以加载截图组件');
                    return;
                }
                const vw = window.innerWidth, vh = window.innerHeight;
                const rects = [...document.querySelectorAll('.content-box, .check-btn')]
                    .filter(el => el.getClientRects().length).map(el => el.getBoundingClientRect());
                if (!rects.length) rects.push(tree.getBoundingClientRect());
                if (topZone.classList.contains('has-img')) rects.push(shotEl.getBoundingClientRect());
                const pad = 28;
                const L = Math.max(0, Math.min(...rects.map(r => r.left)) - pad);
                const T = Math.max(0, Math.min(...rects.map(r => r.top)) - pad);
                const R = Math.min(vw, Math.max(...rects.map(r => r.right)) + pad);
                const B = Math.min(vh, Math.max(...rects.map(r => r.bottom)) + pad);
                html2canvas(document.body, {
                    backgroundColor: getComputedStyle(document.body).backgroundColor,
                    width: vw, height: vh, windowWidth: vw, windowHeight: vh,
                    onclone: d => {
                        const sh = d.getElementById('sheet');
                        if (sh) sh.style.transition = 'none';
                        ['grab', 'toast'].forEach(id => { const el = d.getElementById(id); if (el) el.style.display = 'none'; });
                        d.querySelectorAll('.shot-corner, .shot-edge').forEach(el => { el.style.display = 'none'; });
                        d.querySelectorAll('.reason-tag').forEach(el => { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; });
                        ['.theme-switch', '.toggle-84', '.realm-card'].forEach(q => { const el = d.querySelector(q); if (el) el.style.display = 'none'; });
                    }
                }).then(full => {
                    const k = full.width / vw;
                    const c = document.createElement('canvas');
                    c.width = Math.round((R - L) * k);
                    c.height = Math.round((B - T) * k);
                    c.getContext('2d').drawImage(full, L * k, T * k, (R - L) * k, (B - T) * k, 0, 0, c.width, c.height);
                    c.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
                            .then(() => showToast('已复制截屏', true))
                            .catch(() => alert('写入剪贴板失败'));
                    });
                });
            }
        });

        function putImage(blob) {
            if (!blob || !blob.type || !blob.type.startsWith('image/')) return false;
            const r = new FileReader();
            r.onload = () => {
                openDrawer(true);
                const im = document.getElementById('shot');
                im.onload = () => layoutImage(true);
                im.src = r.result;
                document.getElementById('top-zone').classList.add('has-img');
                showToast('已放入图片', true);
            };
            r.readAsDataURL(blob);
            return true;
        }

        let pasteHandled = false;
        document.addEventListener('paste', e => {
            const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
            if (!item) return;
            e.preventDefault();
            pasteHandled = true;
            putImage(item.getAsFile());
        });

        document.addEventListener('keydown', e => {
            if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.key.toLowerCase() !== 'v') return;
            if (document.getElementById('custom-modal-overlay').classList.contains('active')) return;
            pasteHandled = false;
            setTimeout(async () => {
                if (pasteHandled) return;
                try {
                    const items = await navigator.clipboard.read();
                    for (const it of items) {
                        const t = it.types.find(x => x.startsWith('image/'));
                        if (t) { putImage(await it.getType(t)); return; }
                    }
                    showToast('剪贴板里没有图片', true);
                } catch (err) {
                    showToast('读取剪贴板失败,请把图片拖进页面', true);
                }
            }, 150);
        });

        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => {
            e.preventDefault();
            const f = [...(e.dataTransfer?.files || [])].find(x => x.type.startsWith('image/'));
            if (f) putImage(f); else showToast('请拖入图片文件', true);
        });
        const sheet = document.getElementById('sheet');
        const grab = document.getElementById('grab');
        const topZone = document.getElementById('top-zone');
        const tree = document.querySelector('.tree');
        const rootEl = document.documentElement;
        const shotEl = document.getElementById('shot');
        const shotBox = document.getElementById('shot-box');

        let drawerOpen = false;
        let dragging = false;
        let busyUntil = 0;
        let lastDragEnd = 0;
        let imgW = 0, imgTop = 10;

        // 图片:上边固定,水平居中,只向下放大
        function layoutImage(reset) {
            if (!shotEl.naturalWidth) return;
            const vw = window.innerWidth, vh = window.innerHeight;
            const ar = shotEl.naturalWidth / shotEl.naturalHeight;
            if (reset) {
                imgTop = 10;
                imgW = Math.min(shotEl.naturalWidth, vw - 56, (vh * 0.5 - 56) * ar);
            }
            shotBox.style.top = imgTop + 'px';
            shotBox.style.width = imgW + 'px';
        }

        function resetTree() {
            tree.style.removeProperty('--tx');
            tree.style.removeProperty('--ty');
        }

        function openDrawer(force) {
            if (drawerOpen) return;
            if (!force && Date.now() < busyUntil) return;
            busyUntil = Date.now() + 550;
            drawerOpen = true;
            resetTree();
            rootEl.classList.add('drawer-open');
        }

        function closeDrawer() {
            if (!drawerOpen || Date.now() < busyUntil) return;
            busyUntil = Date.now() + 550;
            drawerOpen = false;
            resetTree();
            rootEl.classList.remove('drawer-open');
            sheet.style.transform = '';
            grab.style.transform = '';
            topZone.classList.remove('has-img');
            shotEl.onload = null;
            shotEl.removeAttribute('src');
        }

        // 横条:只能向下拉出
        grab.addEventListener('pointerdown', e => {
            if (drawerOpen || dragging || e.button !== 0) return;
            dragging = true;
            const startY = e.clientY;
            const vh = window.innerHeight;
            const base = vh * 0.5;
            let d = 0;
            sheet.classList.add('dragging');
            grab.classList.add('dragging');
            rootEl.classList.add('drawer-drag');
            try { grab.setPointerCapture(e.pointerId); } catch (_) {}
            const move = ev => {
                d = Math.min(base, Math.max(0, ev.clientY - startY));
                sheet.style.transform = 'translateY(' + (d / base * vh * 0.25) + 'px)';
                grab.style.transform = 'translateY(' + d + 'px)';
            };
            const up = () => {
                if (!dragging) return;
                dragging = false;
                lastDragEnd = Date.now();
                grab.removeEventListener('pointermove', move);
                grab.removeEventListener('pointerup', up);
                grab.removeEventListener('pointercancel', up);
                grab.removeEventListener('lostpointercapture', up);
                sheet.classList.remove('dragging');
                grab.classList.remove('dragging');
                rootEl.classList.remove('drawer-drag');
                sheet.style.transform = '';
                grab.style.transform = '';
                if (d > 60) openDrawer(true);
            };
            grab.addEventListener('pointermove', move);
            grab.addEventListener('pointerup', up);
            grab.addEventListener('pointercancel', up);
            grab.addEventListener('lostpointercapture', up);
        });

        // 图片四角和四边:以顶部中点为基准,向下居中缩放
        document.querySelectorAll('.shot-corner, .shot-edge').forEach(h => {
            h.addEventListener('pointerdown', e => {
                if (dragging || e.button !== 0 || !shotEl.naturalWidth) return;
                e.preventDefault();
                e.stopPropagation();
                dragging = true;
                const sx = e.clientX, sy = e.clientY, w0 = imgW;
                const c = h.dataset.c;
                const signX = c.indexOf('l') >= 0 ? -1 : (c.indexOf('r') >= 0 ? 1 : 0);
                const signY = c.indexOf('t') >= 0 ? -1 : (c.indexOf('b') >= 0 ? 1 : 0);
                const ar = shotEl.naturalWidth / shotEl.naturalHeight;
                const vw = window.innerWidth, vh = window.innerHeight;
                try { h.setPointerCapture(e.pointerId); } catch (_) {}
                const move = ev => {
                    const gx = 2 * (ev.clientX - sx) * signX;
                    const gy = (ev.clientY - sy) * signY * ar;
                    const w = w0 + (signX && signY ? (gx + gy) / 2 : gx + gy);
                    const maxW = Math.min(vw - 24, (vh - imgTop - 12) * ar);
                    imgW = Math.max(Math.min(160, maxW), Math.min(maxW, w));
                    layoutImage(false);
                };
                const up = () => {
                    if (!dragging) return;
                    dragging = false;
                    lastDragEnd = Date.now();
                    h.removeEventListener('pointermove', move);
                    h.removeEventListener('pointerup', up);
                    h.removeEventListener('pointercancel', up);
                    h.removeEventListener('lostpointercapture', up);
                };
                h.addEventListener('pointermove', move);
                h.addEventListener('pointerup', up);
                h.addEventListener('pointercancel', up);
                h.addEventListener('lostpointercapture', up);
            });
        });

        // 拖动「保护本金」:整棵决策树跟着走,但不能拖出网站边界
        document.addEventListener('pointerdown', e => {
            const box = e.target.closest('#root-node > .content-box');
            if (!box || dragging || e.button !== 0) return;
            const sx = e.clientX, sy = e.clientY;
            const ox = parseFloat(tree.style.getPropertyValue('--tx')) || 0;
            const oy = parseFloat(tree.style.getPropertyValue('--ty')) || 0;
            const vw = window.innerWidth, vh = window.innerHeight, m = 6;
            const rs = [...document.querySelectorAll('.content-box, .check-btn')]
                .filter(el => el.getClientRects().length).map(el => el.getBoundingClientRect());
            const uL = Math.min(...rs.map(r => r.left)), uR = Math.max(...rs.map(r => r.right));
            const uT = Math.min(...rs.map(r => r.top)), uB = Math.max(...rs.map(r => r.bottom));
            let started = false;
            const move = ev => {
                const ddx = ev.clientX - sx, ddy = ev.clientY - sy;
                if (!started) {
                    if (Math.hypot(ddx, ddy) < 5) return;
                    started = true;
                    dragging = true;
                    rootEl.classList.add('tree-drag');
                }
                const cx = Math.min(vw - m - uR, Math.max(m - uL, ddx));
                const cy = Math.min(vh - m - uB, Math.max(m - uT, ddy));
                tree.style.setProperty('--tx', (ox + cx) + 'px');
                tree.style.setProperty('--ty', (oy + cy) + 'px');
            };
            const up = () => {
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', up);
                window.removeEventListener('pointercancel', up);
                if (started) {
                    dragging = false;
                    lastDragEnd = Date.now();
                    rootEl.classList.remove('tree-drag');
                }
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
        });

        // 双击:「保护本金」复位决策树;空白处开 / 关抽屉(动画中、拖动中、刚拖完、点在控件上都忽略)
        document.addEventListener('dblclick', e => {
            const now = Date.now();
            if (dragging || now - lastDragEnd < 450) return;
            if (e.target.closest('#root-node > .content-box')) { resetTree(); return; }
            if (now < busyUntil) return;
            if (e.target.closest('#grab, .shot-corner, .shot-edge, .content-box, .check-btn, .theme-switch, .toggle-84, .realm-card, .modal-overlay')) return;
            drawerOpen ? closeDrawer() : openDrawer();
        });

        window.addEventListener('resize', () => {
            if (shotEl.getAttribute('src') && shotEl.naturalWidth) layoutImage(true);
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function toggleRealms() {
            const card = document.getElementById('realmCard');
            if (!card.classList.contains('show')) {
                const items = card.querySelectorAll('.realm-item');
                items.forEach(item => item.classList.remove('selected'));
            }
            card.classList.toggle('show');
        }

        function toggleSelection(el) { el.classList.toggle('selected'); }

        let pendingCallback = null;

        function openInputModal(callback) {
            pendingCallback = callback;
            const overlay = document.getElementById('custom-modal-overlay');
            const input = document.getElementById('modal-input');
            input.value = '';
            overlay.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }

        function closeInputModal() {
            document.getElementById('custom-modal-overlay').classList.remove('active');
            pendingCallback = null;
        }

        function handleInputConfirm() {
            const val = document.getElementById('modal-input').value.trim();
            if (val && pendingCallback) pendingCallback(val);
            closeInputModal();
        }

        function handleOverlayClick(e) {
            if (e.target.id === 'custom-modal-overlay') closeInputModal();
        }

        document.getElementById('modal-confirm-btn').addEventListener('click', handleInputConfirm);
        document.getElementById('modal-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleInputConfirm();
        });

        function toggleNode(btn, needReason, reasonTagId) {
            let currentRow = btn.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');

            if (btn.classList.contains('active')) {
                resetSelection(currentRow, parentGroup);
                return;
            }

            const activate = (reasonText) => {
                if (reasonTagId && reasonText) {
                    let tag = document.getElementById(reasonTagId);
                    if (tag) {
                        tag.innerText = "# " + reasonText;
                        tag.style.display = "block";
                    }
                }
                btn.classList.add('active');
                currentRow.classList.add('has-children');
                currentRow.classList.add('single-mode');
                let nextWrapper = currentRow.querySelector('.children-wrapper');
                if (nextWrapper) nextWrapper.style.display = 'block';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
            };

            if (needReason) {
                openInputModal((reason) => { activate(reason); });
            } else {
                activate(null);
            }
        }

        function resetSelection(currentRow, parentGroup) {
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = currentRow.querySelector('.reason-tag');
            let nextWrapper = currentRow.querySelector('.children-wrapper');

            btn.classList.remove('active');
            currentRow.classList.remove('has-children');
            currentRow.classList.remove('single-mode');
            if (reasonTag) reasonTag.style.display = 'none';

            if (nextWrapper) {
                nextWrapper.style.display = 'none';
                nextWrapper.querySelectorAll('.node-row').forEach(row => {
                    row.classList.remove('has-children', 'single-mode', 'hidden-sibling');
                    let childBtn = row.querySelector('.check-btn');
                    if (childBtn) childBtn.classList.remove('active');
                    let childTag = row.querySelector('.reason-tag');
                    if (childTag) childTag.style.display = 'none';
                    let childWrapper = row.querySelector('.children-wrapper');
                    if (childWrapper) childWrapper.style.display = 'none';
                });
            }

            if (parentGroup) {
                for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
            }
        }

        let copyTimer = null;
        let pendingText = "";

        function selectLeaf(el, reasonTagId) {
            let currentRow = el.closest('.node-row');
            let parentGroup = currentRow.closest('.node-group');
            let btn = currentRow.querySelector('.check-btn');
            let reasonTag = reasonTagId ? document.getElementById(reasonTagId) : null;

            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentRow.classList.remove('single-mode');
                if (reasonTag) reasonTag.style.display = 'none';
                if (parentGroup) {
                    for (let sibling of parentGroup.children) sibling.classList.remove('hidden-sibling');
                }
                triggerDebouncedCopy(currentRow);
                return;
            }

            openInputModal((reason) => {
                if (reasonTag) {
                    reasonTag.innerText = "# " + reason;
                    reasonTag.style.display = "block";
                }
                btn.classList.add('active');
                currentRow.classList.add('single-mode');
                if (parentGroup) {
                    for (let sibling of parentGroup.children) {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    }
                }
                triggerDebouncedCopy(currentRow);
            });
        }

        function triggerDebouncedCopy(leafRow) {
            let text = calculatePath(leafRow);
            if (!text) return;
            pendingText = text;

            const toast = document.getElementById('toast');
            toast.innerText = "正在选择... (停止后写入)";
            toast.classList.add('show');

            if (copyTimer) clearTimeout(copyTimer);

            copyTimer = setTimeout(() => {
                navigator.clipboard.writeText(pendingText).then(() => {
                    toast.innerText = "已复制决策链";
                    setTimeout(() => { toast.classList.remove('show'); }, 1000);
                }).catch(() => {
                    toast.innerText = "复制失败(浏览器限制)";
                });
            }, 1500);
        }

        function calculatePath(leafRow) {
            let parentGroup = leafRow.closest('.node-group');
            let activeRows = parentGroup.querySelectorAll('.node-row .check-btn.active');
            let activeTexts = [];

            activeRows.forEach(btn => {
                let row = btn.closest('.node-row');
                let contentBox = row.querySelector('.content-box');
                let clone = contentBox.cloneNode(true);
                let tags = clone.querySelectorAll('.reason-tag');
                let reasonText = '';
                tags.forEach(t => {
                    if (t.style.display !== 'none' && t.innerText) reasonText = ' ' + t.innerText;
                    t.remove();
                });
                activeTexts.push(clone.innerText.trim() + reasonText);
            });

            if (activeTexts.length === 0) return null;

            let leafString = activeTexts.join('、');
            let path = [leafString];
            let currentWrapper = parentGroup.closest('.children-wrapper');

            if (currentWrapper) {
                let parentRow = currentWrapper.closest('.node-row');
                while (parentRow && parentRow.id !== 'root-node') {
                    let contentBox = parentRow.querySelector('.content-box');
                    let clone = contentBox.cloneNode(true);
                    clone.querySelectorAll('.reason-tag').forEach(t => t.remove());
                    let mainText = clone.innerText.trim();
                    let reasonTag = contentBox.querySelector('.reason-tag');
                    let reasonText = (reasonTag && reasonTag.style.display !== 'none') ? ` ${reasonTag.innerText}` : '';
                    path.unshift(mainText + reasonText);

                    let gp = parentRow.closest('.node-group');
                    if (!gp) break;
                    let gw = gp.closest('.children-wrapper');
                    if (!gw) break;
                    parentRow = gw.closest('.node-row');
                }
            }
            return path.join(' -> ');
        }

        function showToast(msg, immediate) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
