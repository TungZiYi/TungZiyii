<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Little Green Bottle</title>
    
    <link rel="icon" href="./Little%20Green%20Bottle.png" type="image/png">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #0c0c0e;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --line-color: rgba(255, 255, 255, 0.18);
            --accent: #0a84ff;
            --accent-glow: rgba(10, 132, 255, 0.35);
            
            --float-bg: rgba(30, 30, 32, 0.75);
            --float-border: 1px solid rgba(255, 255, 255, 0.1);
            --float-shadow: 0 12px 40px rgba(0,0,0,0.45);
            
            --float-text-idle: #98989d;
            --float-text-selected: #f5f5f7;
            --float-item-hover: rgba(255, 255, 255, 0.06);

            --card-shadow: 0 4px 24px rgba(0,0,0,0.25);
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-border: rgba(255, 255, 255, 0.12);
            --btn-hover-bg: rgba(255, 255, 255, 0.14);
            --line-width: 1.5px;

            --switch-bg: rgba(255, 255, 255, 0.12);
            --switch-thumb: #fff;
            --switch-icon: #f5f5f7;

            --modal-overlay: rgba(0, 0, 0, 0.55);
            --modal-bg: rgba(30, 30, 32, 0.8);
            --modal-border: rgba(255, 255, 255, 0.1);
            --modal-shadow: 0 24px 60px rgba(0,0,0,0.5);
            
            --modal-input-text: #f5f5f7;
            --modal-input-placeholder: #98989d;
            --modal-btn-confirm-bg: #0a84ff;
            --modal-btn-confirm-text: #fff;
        }

        html.light-mode {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-main: #1d1d1f;
            --line-color: rgba(0, 0, 0, 0.12);
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.25);
            
            --float-bg: rgba(255, 255, 255, 0.82);
            --float-border: 1px solid rgba(0, 0, 0, 0.06);
            --float-shadow: 0 12px 40px rgba(0,0,0,0.08);
            
            --float-text-idle: #8e8e93;
            --float-text-selected: #1d1d1f;
            --float-item-hover: rgba(0, 0, 0, 0.04);

            --card-shadow: 0 4px 20px rgba(0,0,0,0.04);
            --btn-bg: rgba(255, 255, 255, 0.9);
            --btn-border: rgba(0, 0, 0, 0.08);
            --btn-hover-bg: #fff;

            --switch-bg: rgba(0, 0, 0, 0.06);
            --switch-thumb: #fff;
            --switch-icon: #1d1d1f;

            --modal-overlay: rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(255, 255, 255, 0.85);
            --modal-border: rgba(0, 0, 0, 0.06);
            --modal-shadow: 0 24px 60px rgba(0,0,0,0.12);
            
            --modal-input-text: #1d1d1f;
            --modal-input-placeholder: #8e8e93;
            --modal-btn-confirm-bg: #007aff;
            --modal-btn-confirm-text: #fff;
        }

        ::-webkit-scrollbar { display: none !important; }
        html, body { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        html { overflow: hidden; height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
            margin: 0;
            padding: 48px 48px 48px 90px;
            box-sizing: border-box;
            overflow: auto;
            transition: background-color 0.35s ease, color 0.35s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Tree */
        .tree { display: flex; align-items: center; }
        .node-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 52px;
            position: relative;
        }
        .node-row {
            display: flex;
            align-items: center;
            position: relative;
            padding: 12px 0;
            transition: all 0.3s ease;
        }

        .node-row::before {
            content: '';
            position: absolute;
            left: -52px;
            top: 50%;
            width: 52px;
            height: var(--line-width);
            background-color: var(--line-color);
            transform: translateY(-50%);
            z-index: 0;
        }
        #root-node::before { display: none !important; }

        .node-group > .node-row::after {
            content: '';
            position: absolute;
            left: -52px;
            width: var(--line-width);
            height: 100%;
            background-color: var(--line-color);
            top: 0;
        }
        .node-group > .node-row:first-child::after {
            top: 50%;
            height: 50%;
            border-top-left-radius: 10px;
            background: transparent;
            border-left: var(--line-width) solid var(--line-color);
            border-top: var(--line-width) solid var(--line-color);
            width: 52px;
            left: -52px;
        }
        .node-group > .node-row:first-child::before { display: none; }
        .node-group > .node-row:last-child::after {
            top: 0;
            height: 50%;
            border-bottom-left-radius: 10px;
            background: transparent;
            border-left: var(--line-width) solid var(--line-color);
            border-bottom: var(--line-width) solid var(--line-color);
            width: 52px;
            left: -52px;
        }
        .node-group > .node-row:last-child::before { display: none; }
        .node-group > .node-row:not(:first-child):not(:last-child)::after {
            background-color: var(--line-color);
            width: var(--line-width);
            left: -52px;
            top: 0;
            height: 100%;
            border: none;
        }

        .node-row.single-mode::after { display: none !important; }
        .node-row.single-mode::before {
            display: block !important;
            width: 52px !important;
            left: -52px !important;
            border-radius: 0 !important;
            background-color: var(--line-color) !important;
            height: var(--line-width) !important;
            top: 50% !important;
        }
        .node-group > .node-row:only-child::after { display: none; }
        .node-group > .node-row:only-child::before {
            display: block !important;
            left: -52px;
            width: 52px;
        }
        .node-group .content-box::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid var(--line-color);
        }

        /* ========== 统一方形状气泡 ========== */
        .content-box {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 14px 22px;
            border-radius: 16px;          /* 统一圆角 */
            border: 1px solid var(--card-border);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            position: relative;
            z-index: 2;
            min-width: 76px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: var(--card-shadow);
            cursor: pointer;
            line-height: 1.2;
        }

        /* 中间层 & 叶子层 统一放大一点，更清晰 */
        .content-box.icon-node,
        .content-box.leaf-node {
            font-size: 28px;
            padding: 16px 20px;
            min-width: 72px;
            border-radius: 16px;          /* 强制统一方形状 */
        }

        @media (hover: hover) {
            .content-box:hover {
                background: rgba(255, 255, 255, 0.11);
                border-color: rgba(255, 255, 255, 0.18);
            }
            html.light-mode .content-box:hover {
                background: rgba(255, 255, 255, 0.95);
                border-color: rgba(0, 0, 0, 0.1);
            }
        }

        /* Reason Tag */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reason-tag {
            font-size: 11px;
            color: var(--accent);
            background: rgba(10, 132, 255, 0.13);
            padding: 3px 9px;
            border-radius: 20px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
            letter-spacing: 0.2px;
            animation: fadeInUp 0.25s ease forwards;
            white-space: nowrap;
        }
        html.light-mode .reason-tag {
            background: rgba(0, 122, 255, 0.1);
        }

        /* Check Button */
        .check-btn {
            width: 28px;
            height: 28px;
            background: var(--btn-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--btn-border);
            border-radius: 9px;
            margin-left: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: transparent;
            transition: all 0.2s ease;
            z-index: 10;
            flex-shrink: 0;
            position: relative;
        }
        
        @media (hover: hover) {
            .check-btn:hover {
                background: var(--btn-hover-bg);
            }
        }

        .check-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        
        .children-wrapper,
        .node-row.hidden-sibling {
            display: none;
        }
        .has-children::after {
            content: '';
            position: absolute;
            right: -26px;
            top: 50%;
            width: 26px;
            height: var(--line-width);
            background-color: var(--line-color);
            z-index: 0;
            transform: translateY(-50%);
        }

        /* Theme Switch */
        .theme-switch {
            position: fixed;
            top: 24px;
            right: 28px;
            width: 51px;
            height: 31px;
            background-color: var(--switch-bg);
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .theme-switch svg {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--switch-icon);
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        .icon-moon { left: 7px; }
        .icon-sun { right: 7px; }
        html:not(.light-mode) .icon-moon { opacity: 1; }
        html:not(.light-mode) .icon-sun { opacity: 0; }
        html.light-mode .icon-moon { opacity: 0; }
        html.light-mode .icon-sun { opacity: 1; }
        .switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            background-color: var(--switch-thumb);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        html:not(.light-mode) .switch-thumb { transform: translateX(20px); }
        html.light-mode .switch-thumb { transform: translateX(0); }

        .toggle-84 {
            position: fixed;
            top: 24px;
            right: 96px;
            height: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            opacity: 0.35;
            z-index: 1000;
            letter-spacing: 0.4px;
            cursor: pointer;
        }

        /* Realm Card */
        .realm-card {
            position: fixed;
            top: 68px;
            right: 28px;
            width: 112px;
            border-radius: 18px;
            padding: 4px 0;
            overflow: hidden;
            background: var(--float-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: var(--float-shadow);
            border: var(--float-border);
            z-index: 999;
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .realm-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .realm-item {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 9px 0;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--float-text-idle);
            transition: all 0.15s ease;
        }
        @media (hover: hover) {
            .realm-item:not(.selected):hover {
                background-color: var(--float-item-hover);
            }
        }
        .realm-item.selected {
            color: var(--float-text-selected);
            font-weight: 600;
        }
        .realm-time {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            opacity: 0.9;
            text-align: left;
            width: 34px;
        }
        .realm-name {
            letter-spacing: 0.3px;
            text-align: right;
            width: 34px;
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(30, 30, 32, 0.8);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f5f5f7;
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 200;
            pointer-events: none;
        }
        html.light-mode .toast-msg {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 0, 0, 0.06);
            color: #1d1d1f;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--modal-overlay);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: var(--modal-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--modal-border);
            width: 300px;
            max-width: 86%;
            border-radius: 20px;
            padding: 26px 24px 20px;
            box-shadow: var(--modal-shadow);
            transform: scale(0.94);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-input {
            width: 100%;
            padding: 8px 2px;
            font-size: 21px;
            color: var(--modal-input-text);
            background: transparent;
            border: none;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }
        .modal-input::placeholder {
            color: var(--modal-input-placeholder);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 4px;
        }
        .modal-btn {
            border: none;
            padding: 9px 22px;
            border-radius: 980px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.85; }
        .modal-btn.confirm {
            background: var(--modal-btn-confirm-bg);
            color: var(--modal-btn-confirm-text);
        }
    </style>
</head>
<body>

    <div class="toggle-84" onclick="toggleRealms()" title="周期">84</div>

    <div class="realm-card" id="realmCard">
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">1W</span> <span class="realm-name">子怡</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">1D</span> <span class="realm-name">化神</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">4H</span> <span class="realm-name">元婴</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">1H</span> <span class="realm-name">结丹</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">30m</span> <span class="realm-name">筑基</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">15m</span> <span class="realm-name">炼气</span></div>
        <div class="realm-item" onclick="toggleSelection(this)"><span class="realm-time">5m</span> <span class="realm-name">凡人</span></div>
    </div>

    <div class="theme-switch" onclick="toggleTheme()" title="切换外观">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <div class="switch-thumb"></div>
    </div>

    <div class="toast-msg" id="toast">已复制决策链</div>

    <div id="custom-modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <input type="text" id="modal-input" class="modal-input" placeholder="输入理由..." autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn confirm" id="modal-confirm-btn">确认</button>
            </div>
        </div>
    </div>

    <div class="tree">

            <div class="content-box">保护本金</div>
            <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
            
            <div class="children-wrapper">
                <div class="node-group">
                    
                    <!-- 🧊 -->

                        <div class="content-box icon-node">

                        </div>
                        <div class="check-btn" onclick="toggleNode(this, true, 'r-ice')">✔</div>
                        
                        <div class="children-wrapper">
                            <div class="node-group">
                                <div class="node-row">
                                    <div class="content-box icon-node">🧊</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>

                                            <div class="node-row">

                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">💧</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⏳</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">🔥</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⚡</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 💧 -->
                    <div class="node-row">
                        <div class="content-box icon-node">
                            💧
                            <div class="reason-tag" id="r-water"></div>
                        </div>
                        <div class="check-btn" onclick="toggleNode(this, true, 'r-water')">✔</div>

                        <div class="children-wrapper">
                            <div class="node-group">
                                <div class="node-row">
                                    <div class="content-box icon-node">🧊</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⏳</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">💧</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⏳</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">🔥</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⚡</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 🔥 -->
                    <div class="node-row">
                        <div class="content-box icon-node">
                            🔥
                            <div class="reason-tag" id="r-fire"></div>
                        </div>
                        <div class="check-btn" onclick="toggleNode(this, true, 'r-fire')">✔</div>

                        <div class="children-wrapper">
                            <div class="node-group">
                                <div class="node-row">
                                    <div class="content-box icon-node">🧊</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⏳</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">💧</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⏳</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="node-row">
                                    <div class="content-box icon-node">🔥</div>
                                    <div class="check-btn" onclick="toggleNode(this, false)">✔</div>
                                    <div class="children-wrapper">
                                        <div class="node-group">
                                            <div class="node-row">
                                                <div class="content-box leaf-node" onclick="selectLeaf(this)">⚡</div>
                                                <div class="check-btn leaf-btn" onclick="selectLeaf(this)">✔</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (typeof html2canvas === 'undefined') {
                    alert('请连接网络以加载截图组件');
                    return;
                }
                html2canvas(document.body, {
                    backgroundColor: getComputedStyle(document.body).backgroundColor
                }).then(canvas => {
                    canvas.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
                            .then(() => showToast('已复制截屏'))
                            .catch(() => alert('写入剪贴板失败'));
                    });
                });
            }
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function toggleRealms() {
            const card = document.getElementById('realmCard');
            if (!card.classList.contains('show')) {
                card.querySelectorAll('.realm-item').forEach(item => item.classList.remove('selected'));
            }
            card.classList.toggle('show');
        }
        
        function toggleSelection(el) {
            el.classList.toggle('selected');
        }

        let pendingCallback = null; 

        function openInputModal(callback) {
            pendingCallback = callback;
            const overlay = document.getElementById('custom-modal-overlay');
            const input = document.getElementById('modal-input');
            input.value = ''; 
            overlay.classList.add('active');
            setTimeout(() => input.focus(), 80);
        }

        function closeInputModal() {
            document.getElementById('custom-modal-overlay').classList.remove('active');
            pendingCallback = null;
        }

        function handleInputConfirm() {
            const val = document.getElementById('modal-input').value.trim();
            if (val && pendingCallback) pendingCallback(val);
            closeInputModal();
        }

        function handleOverlayClick(e) {
            if (e.target.id === 'custom-modal-overlay') closeInputModal();
        }

        document.getElementById('modal-confirm-btn').addEventListener('click', handleInputConfirm);
        document.getElementById('modal-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleInputConfirm();
        });

        function toggleNode(btn, needReason, reasonTagId) {
            const currentRow = btn.closest('.node-row');
            const parentGroup = currentRow.closest('.node-group');
            
            if (btn.classList.contains('active')) {
                resetSelection(currentRow, parentGroup);
                return;
            }

            const activate = (reasonText) => {
                if (reasonTagId && reasonText) {
                    const tag = document.getElementById(reasonTagId);
                    if (tag) {
                        tag.innerText = "# " + reasonText;
                        tag.style.display = "block";
                    }
                }
                btn.classList.add('active');
                currentRow.classList.add('has-children', 'single-mode');
                const nextWrapper = currentRow.querySelector('.children-wrapper');
                if (nextWrapper) nextWrapper.style.display = 'block';

                if (parentGroup) {
                    [...parentGroup.children].forEach(sibling => {
                        if (sibling !== currentRow) sibling.classList.add('hidden-sibling');
                    });
                }
            };

            if (needReason) {
                openInputModal(activate);
            } else {
                activate(null);
            }
        }

        function resetSelection(currentRow, parentGroup) {
            const btn = currentRow.querySelector('.check-btn');
            const reasonTag = currentRow.querySelector('.reason-tag');
            const nextWrapper = currentRow.querySelector('.children-wrapper');
            
            btn.classList.remove('active');
            currentRow.classList.remove('has-children', 'single-mode');
            if (reasonTag) reasonTag.style.display = 'none';

            if (nextWrapper) {
                nextWrapper.style.display = 'none';
                nextWrapper.querySelectorAll('.node-row').forEach(row => {
                    row.classList.remove('has-children', 'single-mode', 'hidden-sibling');
                    const childBtn = row.querySelector('.check-btn');
                    if (childBtn) childBtn.classList.remove('active');
                    const childTag = row.querySelector('.reason-tag');
                    if (childTag) childTag.style.display = 'none';
                    const childWrapper = row.querySelector('.children-wrapper');
                    if (childWrapper) childWrapper.style.display = 'none';
                });
            }

            if (parentGroup) {
                [...parentGroup.children].forEach(sibling => sibling.classList.remove('hidden-sibling'));
            }
        }

        let copyTimer = null;
        let pendingText = "";

        function selectLeaf(el) {
            const currentRow = el.closest('.node-row');
            const btn = currentRow.querySelector('.check-btn');
            btn.classList.toggle('active');
            triggerDebouncedCopy(currentRow);
        }

        function triggerDebouncedCopy(leafRow) {
            const text = calculatePath(leafRow);
            if (!text) return;
            pendingText = text;

            const toast = document.getElementById('toast');
            toast.innerText = "正在选择...";
            toast.classList.add('show');

            if (copyTimer) clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
                navigator.clipboard.writeText(pendingText).then(() => {
                    toast.innerText = "已复制决策链";
                    setTimeout(() => toast.classList.remove('show'), 1100);
                }).catch(() => {
                    toast.innerText = "复制失败";
                });
            }, 1400);
        }

        function calculatePath(leafRow) {
            const parentGroup = leafRow.closest('.node-group');
            const activeRows = parentGroup.querySelectorAll('.node-row .check-btn.active');
            const activeTexts = [];
            
            activeRows.forEach(btn => {
                const row = btn.closest('.node-row');
                const contentBox = row.querySelector('.content-box');
                const clone = contentBox.cloneNode(true);
                clone.querySelectorAll('.reason-tag').forEach(t => t.remove());
                activeTexts.push(clone.innerText.trim());
            });

            if (activeTexts.length === 0) return null;

            let path = [activeTexts.join('、')];
            let currentWrapper = parentGroup.closest('.children-wrapper');
            
            if (currentWrapper) {
                let parentRow = currentWrapper.closest('.node-row');
                while (parentRow && parentRow.id !== 'root-node') {
                    const contentBox = parentRow.querySelector('.content-box');
                    const clone = contentBox.cloneNode(true);
                    clone.querySelectorAll('.reason-tag').forEach(t => t.remove());
                    let mainText = clone.innerText.trim();
                    const reasonTag = contentBox.querySelector('.reason-tag');
                    const reasonText = (reasonTag && reasonTag.style.display !== 'none') ? ` ${reasonTag.innerText}` : '';
                    path.unshift(mainText + reasonText);
                    
                    const gp = parentRow.closest('.node-group');
                    if (!gp) break;
                    const gw = gp.closest('.children-wrapper');
                    if (!gw) break;
                    parentRow = gw.closest('.node-row');
                }
            }
            return path.join(' → ');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
