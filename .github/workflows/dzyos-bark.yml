
name: DZYOS 30分钟报价

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: DZYOS Bark Notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.parse
          from decimal import Decimal
          from datetime import datetime, timezone, timedelta

          # 基础配置
          BARK_KEY = os.environ.get("BARK_KEY")
          BEIJING = timezone(timedelta(hours=8))

          OKX_API = (
              "https://www.okx.com"
              "/api/v5/market/ticker"
          )

          BARK_API = "https://api.day.app/push"

          if not BARK_KEY:
              raise RuntimeError("BARK_KEY 未配置")

          # 获取OKX永续合约最新成交价
          def get_price(symbol):

              params = urllib.parse.urlencode({
                  "instId": symbol
              })

              url = f"{OKX_API}?{params}"

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DZYOS/1.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=15
              ) as response:
                  result = json.load(response)

              if result.get("code") != "0":
                  raise RuntimeError(
                      f"{symbol} API错误: {result}"
                  )

              data = result.get("data", [])

              if not data:
                  raise RuntimeError(
                      f"{symbol} 无行情数据"
                  )

              ticker = data[0]

              if ticker.get("instId") != symbol:
                  raise RuntimeError(
                      f"{symbol} 合约不匹配"
                  )

              price = Decimal(ticker["last"])
              quote_time = int(ticker["ts"])

              if price <= 0:
                  raise RuntimeError(
                      f"{symbol} 价格无效"
                  )

              now_ms = int(time.time() * 1000)
              delay = now_ms - quote_time

              # 拒绝超过120秒的旧报价
              if not 0 <= delay <= 120000:
                  raise RuntimeError(
                      f"{symbol} 报价过期: {delay}ms"
                  )

              print(
                  f"{symbol}: {price} "
                  f"延迟: {delay}ms"
              )

              return int(price)

          # 最新成交价
          btc = get_price("BTC-USDT-SWAP")
          xau = get_price("XAU-USDT-SWAP")

          # 北京时间
          now = datetime.now(BEIJING)

          # Bark 极简通知格式
          title = f"DZYOS {now:%H:%M}"

          body = (
              f"BTCUSDT {btc}\n"
              f"XAUUSDT {xau}"
          )

          payload = {
              "device_key": BARK_KEY,
              "title": title,
              "body": body,
              "group": "DZYOS",
              "sound": "minuet"
          }

          request = urllib.request.Request(
              BARK_API,
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request, timeout=15
          ) as response:
              result = json.load(response)

          if result.get("code") != 200:
              raise RuntimeError(
                  f"Bark推送失败: {result}"
              )

          print("DZYOS 推送成功")
          print(title)
          print(body)

          PY
