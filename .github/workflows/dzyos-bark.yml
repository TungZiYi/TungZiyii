
name: DZYOS 30分钟收盘

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Send DZYOS Bark Alert
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta

          key = os.environ.get("BARK_KEY")
          if not key:
              raise SystemExit("Missing BARK_KEY")

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DZYOS/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(
                  req, timeout=15
              ) as response:
                  return json.load(response)

          now_ms = int(time.time() * 1000)

          # BTCUSDT：OKX 30分钟已收盘K线
          btc_url = (
              "https://www.okx.com/api/v5/market/candles"
              "?instId=BTC-USDT-SWAP&bar=30m&limit=5"
          )

          btc_data = get_json(btc_url)

          if btc_data.get("code") != "0":
              raise SystemExit("OKX BTC API error")

          closed = [
              c for c in btc_data.get("data", [])
              if len(c) >= 9 and c[8] == "1"
          ]

          if not closed:
              raise SystemExit("No closed BTC candle")

          candle = max(
              closed,
              key=lambda c: int(c[0])
          )

          btc_price = int(float(candle[4]))
          close_ms = int(candle[0]) + 1800000

          btc_age = now_ms - close_ms

          if not 0 <= btc_age <= 2700000:
              raise SystemExit("Stale BTC candle")

          # XAUUSD：Gold API 黄金现货报价
          xau_line = "XAUUSD 暂无新报价"

          try:
              gold = get_json(
                  "https://api.gold-api.com/price/XAU"
              )

              if (
                  gold.get("symbol") != "XAU"
                  or gold.get("currency") != "USD"
              ):
                  raise ValueError("Invalid gold symbol")

              gold_price = float(gold["price"])

              updated_at = datetime.fromisoformat(
                  gold["updatedAt"].replace(
                      "Z", "+00:00"
                  )
              )

              gold_age = (
                  datetime.now(timezone.utc)
                  - updated_at
              ).total_seconds()

              # 黄金报价超过15分钟则标记为过期
              if 0 <= gold_age <= 900:
                  xau_line = (
                      f"XAUUSD {int(gold_price)}"
                  )
              else:
                  print("Gold quote is stale")

          except Exception as error:
              print(
                  "Gold API error:",
                  type(error).__name__
              )

          # 北京时间
          bj = timezone(timedelta(hours=8))

          close_time = datetime.fromtimestamp(
              close_ms / 1000,
              tz=timezone.utc
          ).astimezone(bj)

          # Bark 极简格式
          title = f"DZYOS {close_time:%H:%M}"

          body = (
              f"{xau_line}\n"
              f"BTCUSDT {btc_price}"
          )

          payload = {
              "device_key": key,
              "title": title,
              "body": body,
              "group": "DZYOS",
              "sound": "minuet"
          }

          req = urllib.request.Request(
              "https://api.day.app/push",
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              req, timeout=15
          ) as response:
              result = json.load(response)

          if result.get("code") != 200:
              raise SystemExit("Bark push failed")

          print("DZYOS notification sent")
          print(title)
          print(body)

          PY
