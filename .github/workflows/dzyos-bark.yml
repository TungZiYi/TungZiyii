
name: DZYOS 30分钟报价

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: DZYOS Bark Notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          from decimal import Decimal
          from datetime import datetime, timezone, timedelta

          # ==========================
          # DZYOS 基础配置
          # ==========================

          BARK_KEY = os.environ.get("BARK_KEY")

          if not BARK_KEY:
              raise RuntimeError("BARK_KEY 未配置")

          BEIJING = timezone(timedelta(hours=8))

          BINANCE_API = (
              "https://fapi.binance.com"
              "/fapi/v2/ticker/price"
          )

          BARK_API = "https://api.day.app/push"

          # ==========================
          # 获取币安U本位合约最新成交价
          # ==========================

          def get_price(symbol):

              url = f"{BINANCE_API}?symbol={symbol}"

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "DZYOS/1.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=15
              ) as response:
                  data = json.load(response)

              if data.get("symbol") != symbol:
                  raise RuntimeError(
                      f"{symbol} 交易对异常"
                  )

              price = Decimal(data["price"])
              quote_time = int(data["time"])

              if price <= 0:
                  raise RuntimeError(
                      f"{symbol} 价格无效"
                  )

              now_ms = int(time.time() * 1000)

              delay = now_ms - quote_time

              # 不使用超过120秒的旧报价
              if not 0 <= delay <= 120000:
                  raise RuntimeError(
                      f"{symbol} 报价已过期"
                  )

              print(
                  f"{symbol}: {price} "
                  f"延迟: {delay}ms"
              )

              return int(price)

          # ==========================
          # 获取最新行情
          # ==========================

          btc = get_price("BTCUSDT")
          xau = get_price("XAUUSDT")

          # ==========================
          # 北京时间
          # ==========================

          now = datetime.now(BEIJING)

          # ==========================
          # DZYOS 通知格式
          # ==========================

          title = f"DZYOS {now:%H:%M}"

          body = (
              f"BTCUSDT {btc}\n"
              f"XAUUSDT {xau}"
          )

          # ==========================
          # Bark 推送
          # ==========================

          payload = {
              "device_key": BARK_KEY,
              "title": title,
              "body": body,
              "group": "DZYOS",
              "sound": "minuet"
          }

          request = urllib.request.Request(
              BARK_API,
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=15
          ) as response:
              result = json.load(response)

          if result.get("code") != 200:
              raise RuntimeError(
                  f"Bark 推送失败: {result}"
              )

          print("DZYOS Bark 推送成功")
          print(title)
          print(body)

          PY
