
name: DZYOS 30分钟收盘

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Send DZYOS Alert
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta

          # Bark 密钥
          key = os.environ.get("BARK_KEY")

          if not key:
              raise SystemExit("Missing BARK_KEY")

          # OKX USDT 永续合约
          symbols = {
              "XAUUSDT": "XAU-USDT-SWAP",
              "BTCUSDT": "BTC-USDT-SWAP"
          }

          data = {}
          now = int(time.time() * 1000)

          # 获取30分钟K线收盘价
          for symbol, inst in symbols.items():

              url = (
                  "https://www.okx.com/api/v5/market/candles"
                  f"?instId={inst}&bar=30m&limit=5"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as r:
                  result = json.load(r)

              if result.get("code") != "0":
                  raise SystemExit(
                      f"OKX API failed: {symbol}"
                  )

              # 只读取确认收盘的K线
              closed = [
                  c for c in result["data"]
                  if len(c) >= 9 and c[8] == "1"
              ]

              if not closed:
                  raise SystemExit(
                      f"No closed candle: {symbol}"
                  )

              candle = max(
                  closed,
                  key=lambda c: int(c[0])
              )

              price = float(candle[4])
              close_ms = int(candle[0]) + 1800000

              # 防止使用过期价格
              if now - close_ms > 2700000:
                  raise SystemExit(
                      f"Stale quote: {symbol}"
                  )

              data[symbol] = (price, close_ms)

          # 检查两个品种收盘时间一致
          xau_time = data["XAUUSDT"][1]
          btc_time = data["BTCUSDT"][1]

          if xau_time != btc_time:
              raise SystemExit(
                  "Candle closing times differ"
              )

          # 北京时间 UTC+8
          bj = timezone(timedelta(hours=8))

          close_time = datetime.fromtimestamp(
              xau_time / 1000,
              tz=timezone.utc
          ).astimezone(bj)

          # 获取价格
          xau = int(data["XAUUSDT"][0])
          btc = int(data["BTCUSDT"][0])

          # 极简通知
          title = f"DZYOS {close_time:%H:%M}"

          body = (
              f"XAUUSDT {xau}\n"
              f"BTCUSDT {btc}"
          )

          # Bark 推送设置
          payload = {
              "device_key": key,
              "title": title,
              "body": body,
              "group": "DZYOS",
              "sound": "minuet"
          }

          req = urllib.request.Request(
              "https://api.day.app/push",
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=15) as r:
              response = json.load(r)

          if response.get("code") != 200:
              raise SystemExit("Bark push failed")

          print("DZYOS notification sent successfully")

          PY
